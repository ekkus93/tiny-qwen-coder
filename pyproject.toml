[project]
name = "tiny-qwen-coder"
version = "0.1.0"
description = "Interchangeable LoRA language adapters for Qwen3.5-4B coding specialization."
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "datasets",
    "numpy",
    "peft",
    "pyyaml",
    "torch",
    "transformers",
    "trl",
]

[project.optional-dependencies]
qlora = ["bitsandbytes"]

[project.scripts]
tiny-qwen-coder-env = "tiny_qwen_coder.reporting.environment:main"
tiny-qwen-coder-train-adapter = "tiny_qwen_coder.training:train_adapter"
tiny-qwen-coder-versions = "tiny_qwen_coder.versions:main"
tiny-qwen-coder-python-baseline = "tiny_qwen_coder.evaluation.baseline:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tiny_qwen_coder/evaluation/humaneval.py" = ["SIM114"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
