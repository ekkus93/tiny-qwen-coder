name: P9-004C fix inference-only adapter activation

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004c-fix-inference-activation.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Patch inference-only activation and regression test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/tiny_qwen_coder/evaluation/python_minimum_intervention.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''        setter(self._adapter_name(step))\n        status_getter = getattr(self._model, "get_model_status", None)\n'''
          new = '''        adapter_name = self._adapter_name(step)\n        setter(adapter_name, inference_mode=True)\n        status_getter = getattr(self._model, "get_model_status", None)\n'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one set_adapter activation block, found {source.count(old)}")
          source = source.replace(old, new)
          old_status = '''        active = tuple(getattr(status, "active_adapters", ()))\n        if active != (self._adapter_name(step),):\n            raise MinimumInterventionEvaluationError(\n                "PEFT active adapter does not match requested step"\n            )\n        if getattr(status, "trainable_params", None) != 0:\n            raise MinimumInterventionEvaluationError("P9-004C adapter unexpectedly trainable")\n'''
          new_status = '''        active = tuple(getattr(status, "active_adapters", ()))\n        if active != (adapter_name,):\n            raise MinimumInterventionEvaluationError(\n                "PEFT active adapter does not match requested step"\n            )\n        requires_grad = getattr(status, "requires_grad", None)\n        if (\n            getattr(status, "trainable_params", None) != 0\n            or not isinstance(requires_grad, Mapping)\n            or requires_grad.get(adapter_name) is not False\n        ):\n            raise MinimumInterventionEvaluationError("P9-004C adapter unexpectedly trainable")\n'''
          if source.count(old_status) != 1:
              raise SystemExit(f"expected one adapter status block, found {source.count(old_status)}")
          source = source.replace(old_status, new_status)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/unit/test_python_minimum_intervention.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              "from dataclasses import replace\n\nimport pytest\n",
              "from dataclasses import replace\nfrom typing import Any, cast\n\nimport pytest\n",
              1,
          )
          test = test.replace(
              "    MinimumInterventionEvaluationError,\n",
              "    MinimumInterventionEvaluationError,\n    SnapshotTrajectoryGenerator,\n",
              1,
          )
          addition = '''\n\nclass _FakePeftStatus:\n    def __init__(self) -> None:\n        self.active_adapters: list[str] = []\n        self.trainable_params = 0\n        self.requires_grad: dict[str, bool] = {}\n\n\nclass _FakePeftModel:\n    def __init__(self) -> None:\n        self.status = _FakePeftStatus()\n        self.calls: list[tuple[str, bool]] = []\n\n    def set_adapter(self, adapter_name: str, *, inference_mode: bool = False) -> None:\n        self.calls.append((adapter_name, inference_mode))\n        self.status.active_adapters = [adapter_name]\n        self.status.trainable_params = 0 if inference_mode else 1\n        self.status.requires_grad = {adapter_name: not inference_mode}\n\n    def get_model_status(self) -> _FakePeftStatus:\n        return self.status\n\n\ndef test_snapshot_selection_keeps_peft_adapter_frozen_for_inference() -> None:\n    generator = cast(Any, SnapshotTrajectoryGenerator.__new__(SnapshotTrajectoryGenerator))\n    model = _FakePeftModel()\n    generator._model = model\n    generator._settings = cast(Any, type("Settings", (), {"seed": 123})())\n    generator._active_step = None\n\n    generator.select_step(50)\n\n    assert model.calls == [("step-0050", True)]\n    assert model.status.active_adapters == ["step-0050"]\n    assert model.status.trainable_params == 0\n    assert model.status.requires_grad == {"step-0050": False}\n    assert generator._active_step == 50\n'''
          if "test_snapshot_selection_keeps_peft_adapter_frozen_for_inference" in test:
              raise SystemExit("regression test already exists")
          test_path.write_text(test.rstrip() + addition + "\n", encoding="utf-8")
          PY
          uv run --frozen ruff format src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          uv run --frozen ruff check src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          uv run --frozen mypy src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          uv run --frozen pytest -q tests/unit/test_python_minimum_intervention.py
          git diff --check
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          git diff --cached --quiet && { echo "expected source/test changes" >&2; exit 1; }
          git commit -m "fix: keep P9-004C adapters frozen during selection"
          git push origin HEAD:ralph/p9-004-minimum-intervention
