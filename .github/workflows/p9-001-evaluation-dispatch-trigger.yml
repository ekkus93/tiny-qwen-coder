name: P9-001 evaluation dispatch trigger

on:
  push:
    branches:
      - ralph/p9-001-rank-sweep
    paths:
      - ".github/workflows/p9-001-evaluation-dispatch-trigger.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch permanent protected rank evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run python-p9-rank-sweep-evaluation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref ralph/p9-001-rank-sweep
