name: P9-004 fix UP012

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004-fix-up012.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Apply exact UP012 fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/tiny_qwen_coder/training/minimum_intervention.py")
          text = path.read_text(encoding="utf-8")
          old = 'payload = f"{partition.salt}\\0{suite}\\0{task_id}".encode("utf-8")'
          new = 'payload = f"{partition.salt}\\0{suite}\\0{task_id}".encode()'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one UP012 target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run --frozen ruff format --check src/tiny_qwen_coder/training/minimum_intervention.py
          uv run --frozen ruff check src/tiny_qwen_coder/training/minimum_intervention.py
          git diff --check
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/training/minimum_intervention.py
          git commit -m "fix: satisfy Ruff UP012 in P9-004 protocol"
          git push origin HEAD:ralph/p9-004-minimum-intervention
