name: P8-003 one-shot quality fix

on:
  push:
    branches:
      - ralph/p8-003-cross-language-smoke
    paths:
      - ".github/workflows/p8-003-quality-fix.yml"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p8-003-cross-language-smoke
          clean: true
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync frozen environment
        run: uv sync --frozen
      - name: Apply strict P8-003 typing fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tiny_qwen_coder/evaluation/cross_language_smoke.py")
          text = path.read_text(encoding="utf-8")
          old_import = "    GenerationObservation,\n"
          new_import = "    GenerationObservation,\n    VerifiedAdapterArtifacts,\n"
          old_sig = "def _adapter_identity(artifacts: object) -> dict[str, object]:"
          new_sig = "def _adapter_identity(artifacts: VerifiedAdapterArtifacts) -> dict[str, object]:"
          if text.count(old_import) != 1 or text.count(old_sig) != 1:
              raise SystemExit("P8-003 strict typing patch did not match expected source")
          text = text.replace(old_import, new_import, 1).replace(old_sig, new_sig, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and apply safe lint fixes to P8-003 files
        run: |
          set -euo pipefail
          uv run --frozen ruff format src/tiny_qwen_coder/evaluation/cross_language_smoke.py tests/unit/test_cross_language_smoke.py
          uv run --frozen ruff check --fix src/tiny_qwen_coder/evaluation/cross_language_smoke.py tests/unit/test_cross_language_smoke.py
      - name: Run complete quality gates
        run: |
          set -euo pipefail
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check
      - name: Commit validated cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/evaluation/cross_language_smoke.py tests/unit/test_cross_language_smoke.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git commit -m "fix: satisfy P8-003 quality gates"
          git push origin HEAD:ralph/p8-003-cross-language-smoke
