name: P9-008 lint fix once

on:
  push:
    branches:
      - p9/mbpp-regression-forensics
    paths:
      - ".github/workflows/p9-008-lint-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: p9/mbpp-regression-forensics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Apply Ruff fix and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          target="src/tiny_qwen_coder/evaluation/python_distilled_mbpp_forensics.py"
          uv run --frozen ruff check --unsafe-fixes --fix "$target"
          uv run --frozen ruff format "$target"
          if git diff --quiet -- "$target"; then
            echo "No Ruff changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "style: satisfy Ruff for P9-008 forensics"
          git push origin HEAD:p9/mbpp-regression-forensics
