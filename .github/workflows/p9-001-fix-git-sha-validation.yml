name: P9-001 fix Git SHA validation

on:
  push:
    branches:
      - ralph/p9-001-rank-sweep
    paths:
      - ".github/workflows/p9-001-fix-git-sha-validation.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v5
        with:
          ref: ralph/p9-001-rank-sweep
          fetch-depth: 1

      - name: Verify patch preimages and apply exact fix
        run: |
          set -euo pipefail
          [[ "$(git hash-object src/tiny_qwen_coder/evaluation/python_rank_sweep.py)" == "4fb0aa5494f3efd0cb285c40661137715bb8fb1a" ]]
          [[ "$(git hash-object tests/unit/test_python_rank_sweep_evaluation.py)" == "42147cbfc92762bab6de9fa9461f121d31c75d71" ]]
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/tiny_qwen_coder/evaluation/python_rank_sweep.py")
          source = source_path.read_text(encoding="utf-8")

          anchor = '''def _sha256(value: str, *, context: str) -> str:\n    if len(value) != 64 or any(char not in "0123456789abcdef" for char in value):\n        raise PythonRankSweepEvaluationError(f"{context} must be a lowercase SHA-256")\n    return value\n\n\n'''
          replacement = anchor + '''def _git_sha(value: str, *, context: str) -> str:\n    if len(value) != 40 or any(char not in "0123456789abcdef" for char in value):\n        raise PythonRankSweepEvaluationError(\n            f"{context} must be a lowercase 40-character Git SHA"\n        )\n    return value\n\n\n'''
          if source.count(anchor) != 1:
              raise SystemExit("SHA-256 helper preimage drifted")
          source = source.replace(anchor, replacement, 1)

          old_registry = '''    training_sha = _sha256(\n        _string(root, "training_source_git_sha", context="rank candidate registry"),\n        context="rank candidate registry.training_source_git_sha",\n    )\n'''
          new_registry = old_registry.replace("_sha256(", "_git_sha(", 1)
          if source.count(old_registry) != 1:
              raise SystemExit("registry Git SHA call preimage drifted")
          source = source.replace(old_registry, new_registry, 1)

          old_candidate = '''                training_git_sha=_sha256(\n                    _string(candidate, "training_git_sha", context=context),\n                    context=f"{context}.training_git_sha",\n                ),\n'''
          new_candidate = old_candidate.replace("_sha256(", "_git_sha(", 1)
          if source.count(old_candidate) != 1:
              raise SystemExit("candidate Git SHA call preimage drifted")
          source = source.replace(old_candidate, new_candidate, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/unit/test_python_rank_sweep_evaluation.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test = '    rank32["training_git_sha"] = "0" * 64\n'
          new_test = '    rank32["training_git_sha"] = "0" * 40\n'
          if test_text.count(old_test) != 1:
              raise SystemExit("training SHA drift test preimage drifted")
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- src/tiny_qwen_coder/evaluation/python_rank_sweep.py tests/unit/test_python_rank_sweep_evaluation.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate focused fix
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen ruff format src/tiny_qwen_coder/evaluation/python_rank_sweep.py tests/unit/test_python_rank_sweep_evaluation.py
          uv run --frozen ruff check src/tiny_qwen_coder/evaluation/python_rank_sweep.py tests/unit/test_python_rank_sweep_evaluation.py
          uv run --frozen mypy src/tiny_qwen_coder/evaluation/python_rank_sweep.py tests/unit/test_python_rank_sweep_evaluation.py
          uv run --frozen pytest tests/unit/test_python_rank_sweep_evaluation.py
          git diff --check

      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/evaluation/python_rank_sweep.py tests/unit/test_python_rank_sweep_evaluation.py
          git diff --cached --check
          git commit -m "fix: distinguish Git SHAs in P9-001 evaluation"
          git push origin HEAD:ralph/p9-001-rank-sweep
