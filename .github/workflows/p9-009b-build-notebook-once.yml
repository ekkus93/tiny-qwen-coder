name: P9-009B Build Notebook Once

on:
  push:
    branches:
      - p9/semantic-contract-generation
    paths:
      - .github/workflows/p9-009b-build-notebook-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Build canonical P9-009B notebook
        run: uv run --frozen python scripts/teacher_distillation/build_p9_009_semantic_contract_colab_notebook.py
      - name: Commit notebook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/teacher_distillation/qwen38_p9_009_semantic_contract_generation_colab.ipynb
          git commit -m 'feat: add P9-009B semantic-contract Colab notebook'
          git push origin HEAD:p9/semantic-contract-generation
