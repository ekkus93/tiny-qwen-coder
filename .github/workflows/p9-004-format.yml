name: P9-004 format protocol implementation

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Format P9-004 Python files
        run: |
          uv run --frozen ruff format src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          uv run --frozen ruff format --check src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          git diff --check
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          git commit -m "style: format P9-004 protocol implementation"
          git push origin HEAD:ralph/p9-004-minimum-intervention
