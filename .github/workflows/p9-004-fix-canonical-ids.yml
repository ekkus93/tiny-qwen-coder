name: P9-004 fix canonical candidate IDs

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004-fix-canonical-ids.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Fix frozen canonical candidate IDs
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/tiny_qwen_coder/training/minimum_intervention.py")
          text = source.read_text(encoding="utf-8")
          marker = '''_EXPECTED_CANDIDATES = (
              ("lr-1e-5", 0.00001, "configs/train/python/p9_min_lr_1e5.yaml"),
              ("lr-2e-5", 0.00002, "configs/train/python/p9_min_lr_2e5.yaml"),
              ("lr-5e-5", 0.00005, "configs/train/python/p9_min_lr_5e5.yaml"),
              ("lr-1e-4", 0.0001, "configs/train/python/p9_min_lr_1e4.yaml"),
              ("lr-2e-4", 0.0002, "configs/train/python/p9_min_lr_2e4.yaml"),
          )
          '''
          replacement = marker + '''_EXPECTED_CANDIDATE_SUFFIXES = {
              "lr-1e-5": "p9-min-lr-1e5",
              "lr-2e-5": "p9-min-lr-2e5",
              "lr-5e-5": "p9-min-lr-5e5",
              "lr-1e-4": "p9-min-lr-1e4",
              "lr-2e-4": "p9-min-lr-2e4",
          }
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"expected one candidate marker, found {text.count(marker)}")
          text = text.replace(marker, replacement, 1)
          old = '        expected_suffix = f"p9-min-{candidate.label}"\n'
          new = '        expected_suffix = _EXPECTED_CANDIDATE_SUFFIXES[candidate.label]\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one suffix derivation, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/unit/test_minimum_intervention.py")
          test_text = test.read_text(encoding="utf-8")
          anchor = '    assert report.snapshot_count == 25\n'
          additions = '''    assert tuple(item.adapter_id for item in report.candidates) == (
              "language/python/p9-min-lr-1e5",
              "language/python/p9-min-lr-2e5",
              "language/python/p9-min-lr-5e5",
              "language/python/p9-min-lr-1e4",
              "language/python/p9-min-lr-2e4",
          )
          assert tuple(item.output_dir for item in report.candidates) == (
              "artifacts/train/python/p9-min-lr-1e5",
              "artifacts/train/python/p9-min-lr-2e5",
              "artifacts/train/python/p9-min-lr-5e5",
              "artifacts/train/python/p9-min-lr-1e4",
              "artifacts/train/python/p9-min-lr-2e4",
          )
          ''' + anchor
          if test_text.count(anchor) != 1:
              raise SystemExit(f"expected one snapshot anchor, found {test_text.count(anchor)}")
          test.write_text(test_text.replace(anchor, additions, 1), encoding="utf-8")
          PY
          uv run --frozen ruff format src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          uv run --frozen ruff check src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          uv run --frozen mypy src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          uv run --frozen pytest -q tests/unit/test_minimum_intervention.py
          git diff --check
      - name: Commit canonical ID fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/training/minimum_intervention.py tests/unit/test_minimum_intervention.py
          git commit -m "fix: freeze P9-004 canonical candidate identities"
          git push origin HEAD:ralph/p9-004-minimum-intervention
