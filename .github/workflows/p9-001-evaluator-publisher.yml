name: P9-001 evaluator publisher

on:
  push:
    branches:
      - ralph/p9-001-rank-sweep
    paths:
      - ".github/workflows/p9-001-evaluator-publisher.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ralph/p9-001-rank-sweep
          fetch-depth: 1

      - name: Materialize reviewed evaluator payload
        env:
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          printf '%s' "${PAYLOAD_B64}" | base64 -d > "${RUNNER_TEMP}/p9-eval-payload.tar.gz"
          echo "79fb57c2cf534880e3e4e6c692b332037501653def3e3b7f2d0c2e438fb9ac29  ${RUNNER_TEMP}/p9-eval-payload.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/p9-eval-payload.tar.gz" -C .
          expected=$'.github/workflows/python-p9-rank-sweep-evaluation.yml\nsrc/tiny_qwen_coder/evaluation/python_rank_sweep.py\ntests/unit/test_python_rank_sweep_evaluation.py'
          actual="$(git status --short | awk '{print $2}' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            printf 'Unexpected publisher diff:\n%s\n' "${actual}" >&2
            exit 1
          fi
          git diff --check

      - name: Commit evaluator package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/python-p9-rank-sweep-evaluation.yml src/tiny_qwen_coder/evaluation/python_rank_sweep.py tests/unit/test_python_rank_sweep_evaluation.py
          git diff --cached --check
          git commit -m "eval: add protected P9-001 rank evaluation"
          git push origin HEAD:ralph/p9-001-rank-sweep
