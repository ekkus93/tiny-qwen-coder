name: P9-001 evaluator publisher

on:
  push:
    branches:
      - ralph/p9-001-rank-sweep
    paths:
      - ".github/workflows/p9-001-evaluator-publisher.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ralph/p9-001-rank-sweep
          fetch-depth: 1

      - name: Materialize reviewed evaluator source
        run: |
          set -euo pipefail
          mkdir -p src/tiny_qwen_coder/evaluation
          base64 -d .p9/python_rank_sweep.py.gz.b64 | gzip -dc > src/tiny_qwen_coder/evaluation/python_rank_sweep.py
          echo "7118f67d18f1a9f9afbdb586928fc4a81606be06a7ccd1a71881746693bd3aa5  src/tiny_qwen_coder/evaluation/python_rank_sweep.py" | sha256sum -c -
          echo "598cbde625298c6090ec06cfe5ad00b502414b2b99c92b9809a1b30da4f91be7  tests/unit/test_python_rank_sweep_evaluation.py" | sha256sum -c -
          echo "ca8597aff462e4777596eea7bb3925e41c7520fd341a043a3542e1c30071a095  .github/workflows/python-p9-rank-sweep-evaluation.yml" | sha256sum -c -
          rm .p9/python_rank_sweep.py.gz.b64
          rmdir .p9
          rm .github/workflows/p9-001-evaluator-publisher.yml
          git diff --check

      - name: Commit evaluator package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "eval: add protected P9-001 rank evaluation"
          git push origin HEAD:ralph/p9-001-rank-sweep
