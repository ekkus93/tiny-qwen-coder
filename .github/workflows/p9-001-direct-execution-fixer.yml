name: P9-001 direct execution fixer

on:
  push:
    branches:
      - ralph/p9-001-rank-sweep
    paths:
      - ".github/workflows/p9-001-direct-execution-fixer.yml"

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-001-rank-sweep
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Apply direct execution patch
        run: python scripts/p9_apply_direct_execution_patch.py

      - name: Format changed Python
        run: |
          uv run --frozen ruff format \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/python_rank_sweep.py \
            tests/unit/test_constrained_execution.py

      - name: Validate targeted implementation
        run: |
          set -euo pipefail
          uv run --frozen ruff check \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/python_rank_sweep.py \
            tests/unit/test_constrained_execution.py \
            tests/unit/test_python_rank_sweep_evaluation.py
          uv run --frozen mypy \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/python_rank_sweep.py
          uv run --frozen pytest -q \
            tests/unit/test_constrained_execution.py \
            tests/unit/test_python_rank_sweep_evaluation.py
          git diff --check

      - name: Commit source and tests only
        run: |
          set -euo pipefail
          git restore .github/workflows/python-p9-rank-sweep-evaluation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/python_rank_sweep.py \
            tests/unit/test_constrained_execution.py
          git diff --cached --check
          git commit -m "feat: support direct P9 benchmark execution"
          git push origin HEAD:ralph/p9-001-rank-sweep
