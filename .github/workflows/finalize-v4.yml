name: Finalize v4 Colab workflow

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/finalize-v4.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Repair strict v4 shard-row parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tiny_qwen_coder/distillation/v4_compression.py")
          text = path.read_text(encoding="utf-8")
          marker = '''def _student_with_answer(
              source: NormalizedTrainingRecord,
              answer: str,
          ) -> NormalizedTrainingRecord:
          '''
          helper = '''def _row_int(row: dict[str, object], key: str) -> int:
              value = row.get(key)
              if isinstance(value, bool) or not isinstance(value, int):
                  raise TeacherV4CompressionError(
                      f"compression row field {key!r} must be an integer"
                  )
              return value


          '''
          if "def _row_int(" not in text:
              if marker not in text:
                  raise SystemExit("could not locate v4 row parser insertion point")
              text = text.replace(marker, helper + marker, 1)

          replacements = {
              'budget = int(row["target_answer_budget_tokens"])':
                  'budget = _row_int(row, "target_answer_budget_tokens")',
              'compressed_answer_tokens = int(row["compressed_answer_tokens"])':
                  'compressed_answer_tokens = _row_int(row, "compressed_answer_tokens")',
              'compressed_full_tokens = int(row["compressed_full_record_tokens"])':
                  'compressed_full_tokens = _row_int(row, "compressed_full_record_tokens")',
              'ratio = compressed_answer_tokens / max(1, int(row["original_answer_tokens"]))':
                  'ratio = compressed_answer_tokens / max(1, _row_int(row, "original_answer_tokens"))',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"could not locate expected v4 expression: {old}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build v4 notebook
        run: uv run --frozen python scripts/teacher_distillation/build_v4_colab_notebook.py

      - name: Format v4 implementation
        run: |
          uv run --frozen ruff format \
            scripts/teacher_distillation/build_v4_colab_notebook.py \
            scripts/teacher_distillation/compress_teacher_v4.py \
            scripts/teacher_distillation/diagnose_prepared_teacher_data.py \
            scripts/teacher_distillation/finalize_prepared_teacher_data.py \
            scripts/teacher_distillation/qwen38_teacher_distillation_v4_colab.ipynb \
            src/tiny_qwen_coder/distillation/finalize_records.py \
            src/tiny_qwen_coder/distillation/v4_compression.py \
            tests/unit/test_teacher_distillation_v4.py

      - name: Fix safe lint issues
        run: uv run --frozen ruff check --fix .

      - name: Validate full CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check

      - name: Commit final v4 runbook and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v4.yml
          git add -A
          git commit -m "feat: finalize bounded v4 compression study"
          git push origin HEAD:master
