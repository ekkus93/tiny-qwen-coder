name: Implement bounded v3 teacher study

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Apply repository patch
        run: python .github/scripts/implement_v3_repo_patch.py
      - name: Normalize
        run: |
          uv run --frozen ruff format .
          uv run --frozen ruff check --fix .
          uv run --frozen ruff format .
      - name: Validate CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check
      - name: Commit v3 implementation and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-v3-teacher-study.yml
          git rm -f .github/scripts/implement_v3_repo_patch.py
          git add src/tiny_qwen_coder/distillation \
                  scripts/teacher_distillation \
                  configs/distillation/python/qwen38_27b_v3.yaml \
                  configs/data/python/qwen38_27b_distilled_v3.yaml \
                  tests/unit/test_teacher_distillation_v3.py
          git commit -m "feat: add bounded v3 teacher budget study"
          git push origin HEAD:master
