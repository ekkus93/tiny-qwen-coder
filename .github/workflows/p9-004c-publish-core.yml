name: P9-004C publish evaluator core

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004c-publish-core.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Materialize evaluator and tests
        env:
          CORE_GZ_B64: 
          TEST_GZ_B64: 
        run: |
          set -euo pipefail
          mkdir -p src/tiny_qwen_coder/evaluation tests/unit
          printf '%s' "${CORE_GZ_B64}" | base64 -d | gzip -d > src/tiny_qwen_coder/evaluation/python_minimum_intervention.py
          printf '%s' "${TEST_GZ_B64}" | base64 -d | gzip -d > tests/unit/test_python_minimum_intervention.py
          uv run --frozen ruff format src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          uv run --frozen ruff check src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          uv run --frozen mypy src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          uv run --frozen pytest -q tests/unit/test_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          git diff --check
      - name: Commit evaluator core
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/evaluation/python_minimum_intervention.py tests/unit/test_python_minimum_intervention.py
          git commit -m "P9-004C: implement development checkpoint evaluator core"
          git push origin HEAD:ralph/p9-004-minimum-intervention
