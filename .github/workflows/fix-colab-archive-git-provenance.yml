name: Fix Colab archive Git provenance

on:
  push:
    paths:
      - .github/workflows/fix-colab-archive-git-provenance.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync frozen environment
        run: uv sync --frozen --group dev

      - name: Update Colab notebook and README
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path('scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb')
          notebook = json.loads(notebook_path.read_text(encoding='utf-8'))

          # Make the ZIP extraction step establish a deterministic local Git identity.
          for cell in notebook['cells']:
              source = ''.join(cell.get('source', []))
              if cell.get('cell_type') == 'markdown' and source.startswith('## 4. Verify and extract the frozen repository ZIP'):
                  source = source.replace(
                      'The cell also finds the repository root automatically whether the archive contains\n'
                      'the files directly or wraps them in a directory such as `tiny-qwen-coder-master/`.',
                      'The cell also finds the repository root automatically whether the archive contains\n'
                      'the files directly or wraps them in a directory such as `tiny-qwen-coder-master/`.\n\n'
                      'Because a GitHub ZIP intentionally contains no `.git` directory, this step also creates\n'
                      'a **local deterministic Git commit** over the extracted source tree. This is provenance\n'
                      'only: no remote is configured and no GitHub credentials, clone, pull, or push are used.\n'
                      'The commit message binds the sealed repository ZIP SHA-256 so generic dataset manifests\n'
                      'can record a valid source-tree Git identity during finalization.'
                  )
                  cell['source'] = source.splitlines(keepends=True)
                  break
          else:
              raise SystemExit('Step 4 markdown cell not found')

          for cell in notebook['cells']:
              source = ''.join(cell.get('source', []))
              if cell.get('cell_type') == 'code' and 'repo = repo_candidates[0]' in source and 'TQC_CODE_ARCHIVE_SHA256' in source:
                  needle = (
                      'repo = repo_candidates[0]\n'
                      'os.environ["TQC_REPO"] = str(repo)\n'
                      'os.environ["TQC_CODE_ARCHIVE_SHA256"] = archive_sha256\n\n'
                      'print("repository:", repo)\n'
                      'print("archive SHA-256:", archive_sha256)\n'
                      'print("checksum:", checksum_path)'
                  )
                  replacement = (
                      'repo = repo_candidates[0]\n'
                      'os.environ["TQC_REPO"] = str(repo)\n'
                      'os.environ["TQC_CODE_ARCHIVE_SHA256"] = archive_sha256\n\n'
                      '# GitHub source ZIPs deliberately omit .git. Create a deterministic local commit\n'
                      '# so the generic dataset-manifest provenance code can still record an exact\n'
                      '# source-tree identity without any remote, credentials, clone, pull, or push.\n'
                      'git_env = os.environ.copy()\n'
                      'git_env.update(\n'
                      '    {\n'
                      '        "GIT_AUTHOR_NAME": "Tiny Qwen Coder Archive",\n'
                      '        "GIT_AUTHOR_EMAIL": "archive@tiny-qwen-coder.invalid",\n'
                      '        "GIT_COMMITTER_NAME": "Tiny Qwen Coder Archive",\n'
                      '        "GIT_COMMITTER_EMAIL": "archive@tiny-qwen-coder.invalid",\n'
                      '        "GIT_AUTHOR_DATE": "2000-01-01T00:00:00+00:00",\n'
                      '        "GIT_COMMITTER_DATE": "2000-01-01T00:00:00+00:00",\n'
                      '    }\n'
                      ')\n'
                      'subprocess.run(["git", "init", "--quiet"], cwd=repo, check=True, env=git_env)\n'
                      'subprocess.run(\n'
                      '    ["git", "-c", "core.autocrlf=false", "add", "--all"],\n'
                      '    cwd=repo,\n'
                      '    check=True,\n'
                      '    env=git_env,\n'
                      ')\n'
                      'subprocess.run(\n'
                      '    [\n'
                      '        "git",\n'
                      '        "commit",\n'
                      '        "--quiet",\n'
                      '        "--no-gpg-sign",\n'
                      '        "-m",\n'
                      '        f"Frozen repository archive sha256:{archive_sha256}",\n'
                      '    ],\n'
                      '    cwd=repo,\n'
                      '    check=True,\n'
                      '    env=git_env,\n'
                      ')\n'
                      'archive_git_sha = subprocess.check_output(\n'
                      '    ["git", "rev-parse", "HEAD"], cwd=repo, text=True, env=git_env\n'
                      ').strip()\n'
                      'archive_git_status = subprocess.check_output(\n'
                      '    ["git", "status", "--porcelain"], cwd=repo, text=True, env=git_env\n'
                      ')\n'
                      'if archive_git_status.strip():\n'
                      '    raise RuntimeError("Extracted repository is unexpectedly dirty after provenance commit.")\n'
                      'os.environ["TQC_ARCHIVE_GIT_SHA"] = archive_git_sha\n\n'
                      'print("repository:", repo)\n'
                      'print("archive SHA-256:", archive_sha256)\n'
                      'print("archive provenance Git SHA:", archive_git_sha)\n'
                      'print("checksum:", checksum_path)'
                  )
                  if needle not in source:
                      raise SystemExit('Step 4 extraction block shape changed unexpectedly')
                  source = source.replace(needle, replacement)
                  # subprocess is needed now in Step 4, before Step 5 imports it.
                  source = source.replace('import hashlib\nimport shutil\n', 'import hashlib\nimport shutil\nimport subprocess\n', 1)
                  cell['source'] = source.splitlines(keepends=True)
                  break
          else:
              raise SystemExit('Step 4 code cell not found')

          notebook_path.write_text(json.dumps(notebook, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')

          readme_path = Path('scripts/teacher_distillation/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '3. installs `vllm==0.28.0` and this repository with\n'
              '   `uv pip install --torch-backend=cu129`;\n'
              '4. lets vLLM own its compatible Torch/TorchAudio/TorchVision constraints while uv\n'
              '   selects the CUDA 12.9 wheel backend; and\n'
              '5. runs all teacher scripts through `/content/tqc-teacher-venv/bin/python`.\n\n'
              '`requirements/colab-teacher.txt` intentionally pins only the top-level teacher runtime:\n\n'
              '```text\n'
              'vllm==0.28.0\n'
              '```\n\n'
              'Do not manually add `torch==...+cu129`, `torchaudio==...+cu129`, or\n'
              '`torchvision==...+cu129` pins. The vLLM wheel and uv backend selection should resolve\n'
              'the compatible CUDA stack together.\n\n'
              'The NVIDIA driver may still report CUDA 13.0 in `nvidia-smi`. That is expected. The\n'
              'notebook verifies that the isolated PyTorch runtime itself is using CUDA 12.9.',
              '3. installs `ninja==1.13.2`, `vllm==0.28.0`, and this repository with\n'
              '   `uv pip install --torch-backend=cu130`;\n'
              '4. lets vLLM own its compatible PyTorch constraint while uv selects the CUDA 13.0\n'
              '   wheel backend;\n'
              '5. prepends the uv environment `bin/` directory to `PATH` so FlashInfer JIT builds\n'
              '   can find Ninja; and\n'
              '6. runs all teacher scripts through `/content/tqc-teacher-venv/bin/python`.\n\n'
              '`requirements/colab-teacher.txt` pins the required top-level runtime tools:\n\n'
              '```text\n'
              'ninja==1.13.2\n'
              'vllm==0.28.0\n'
              '```\n\n'
              'Do not manually add PyTorch/TorchAudio/TorchVision CUDA pins. The vLLM wheel and uv\n'
              'backend selection should resolve the compatible CUDA stack together.\n\n'
              'The NVIDIA driver and the isolated PyTorch runtime should both report CUDA 13.0.'
          )
          readme = readme.replace(
              'Before opening Colab, make or download a ZIP containing the exact repository version\n'
              'you want to run. The ZIP does not need a `.git` directory.\n',
              'Before opening Colab, make or download a ZIP containing the exact repository version\n'
              'you want to run. The ZIP does not need a `.git` directory. After extraction, the notebook\n'
              'creates a deterministic local Git commit solely for source-tree provenance. No remote is\n'
              'configured, and this does not require GitHub credentials or network Git operations.\n'
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate full CPU quality gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          text = p.read_text(encoding='utf-8')
          assert nb['nbformat'] == 4
          assert 'TQC_ARCHIVE_GIT_SHA' in text
          assert 'Frozen repository archive sha256:' in text
          assert '--torch-backend=cu130' in text
          assert 'ninja==1.13.2' in Path('requirements/colab-teacher.txt').read_text(encoding='utf-8')
          PY

      - name: Commit validated fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-colab-archive-git-provenance.yml
          git add scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb scripts/teacher_distillation/README.md
          git commit -m 'fix: support ZIP provenance during teacher finalization'
          git push origin HEAD:master
