name: P9-009B Polish Once

on:
  push:
    branches:
      - p9/semantic-contract-generation
    paths:
      - .github/workflows/p9-009b-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Update P9-009B docs and indexes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('scripts/teacher_distillation/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('There are now six executable notebooks:', 'There are now seven executable notebooks:', 1)
          salvage = '- [`qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb`](qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb) — **current authoritative repair workflow for the completed v4-2000 evidence**.\n'
          new_bullet = '- [`qwen38_p9_009_semantic_contract_generation_colab.ipynb`](qwen38_p9_009_semantic_contract_generation_colab.ipynb) — P9-009B candidate-hidden semantic-contract generation workflow over the frozen repaired 1,557-example corpus.\n'
          if new_bullet not in text:
              if salvage not in text:
                  raise SystemExit('README salvage notebook bullet not found')
              text = text.replace(salvage, salvage + new_bullet, 1)
          open_line = '**Open the current v4-2000 salvage workflow in Colab:** [qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb](https://colab.research.google.com/github/ekkus93/tiny-qwen-coder/blob/master/scripts/teacher_distillation/qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb)\n'
          p9_open = '**Open P9-009B semantic-contract generation in Colab:** [qwen38_p9_009_semantic_contract_generation_colab.ipynb](https://colab.research.google.com/github/ekkus93/tiny-qwen-coder/blob/master/scripts/teacher_distillation/qwen38_p9_009_semantic_contract_generation_colab.ipynb)\n'
          if p9_open not in text:
              if open_line not in text:
                  raise SystemExit('README salvage Colab link not found')
              text = text.replace(open_line, open_line + '\n' + p9_open, 1)
          table_salvage = '| `qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb` | Current executable repair workflow for the affected completed v4-2000 generation evidence. |\n'
          table_new = '| `qwen38_p9_009_semantic_contract_generation_colab.ipynb` | P9-009B A100 workflow for resumable candidate-hidden semantic-contract generation. |\n'
          if table_new not in text:
              if table_salvage not in text:
                  raise SystemExit('README salvage table row not found')
              text = text.replace(table_salvage, table_salvage + table_new, 1)
          builder_salvage = '| `build_v4_2000_salvage_colab_notebook.py` | Deterministically rebuild and repository-Ruff-canonicalize the v4-2000 salvage notebook. |\n'
          builder_new = '| `build_p9_009_semantic_contract_colab_notebook.py` | Deterministically rebuild and repository-Ruff-canonicalize the P9-009B semantic-contract notebook. |\n'
          if builder_new not in text:
              if builder_salvage not in text:
                  raise SystemExit('README salvage builder row not found')
              text = text.replace(builder_salvage, builder_salvage + builder_new, 1)
          readme.write_text(text, encoding='utf-8')

          todo = Path('docs/TODO.md')
          text = todo.read_text(encoding='utf-8')
          old = '- [ ] **P9-009A** freeze candidate-hidden independent semantic-contract tooling and protocol.'
          new = '- [x] **P9-009A** freeze candidate-hidden independent semantic-contract tooling and protocol.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('P9-009A TODO entry not found')
          todo.write_text(text, encoding='utf-8')

          doc = Path('docs/P9_009_EXECUTABLE_SEMANTIC_FILTERING.md')
          text = doc.read_text(encoding='utf-8')
          status_old = 'No P9-009 training is authorized by this implementation alone. The first live result is a survivor\ncensus over the already-repaired 1,557 examples.\n'
          status_new = 'P9-009A is complete and merged. No P9-009 training is authorized yet. P9-009B now generates\nthe independent candidate-hidden contracts; the first model-changing decision remains gated on the\nP9-009C survivor census over the already-repaired 1,557 examples.\n'
          if status_old in text:
              text = text.replace(status_old, status_new, 1)
          elif status_new not in text:
              raise SystemExit('P9-009 status paragraph not found')
          b_old = 'Run the separately seeded verifier over the fixed repaired accepted corpus. Generation is durable\nand resumable. This does not increase the 2,000 candidate-answer ceiling because the outputs are\nverification evidence, not new student targets.\n'
          b_new = 'Run the separately seeded verifier over the fixed repaired accepted corpus. Generation is durable\nand resumable. This does not increase the 2,000 candidate-answer ceiling because the outputs are\nverification evidence, not new student targets. The canonical A100 workflow is\n[`scripts/teacher_distillation/qwen38_p9_009_semantic_contract_generation_colab.ipynb`](../scripts/teacher_distillation/qwen38_p9_009_semantic_contract_generation_colab.ipynb). It writes sealed shards to\n`MyDrive/tiny-qwen-coder/distillation/qwen38-27b-v4-2000-semantic-v1/` and creates a deterministic\ntransfer ZIP for P9-009C only after all 1,557 records verify complete.\n'
          if b_old in text:
              text = text.replace(b_old, b_new, 1)
          elif b_new not in text:
              raise SystemExit('P9-009B section text not found')
          doc.write_text(text, encoding='utf-8')
          PY
      - name: Canonicalize and lint P9-009B code/notebook
        run: |
          uv run --frozen ruff check --fix scripts/teacher_distillation/build_p9_009_semantic_contract_colab_notebook.py tests/unit/test_teacher_distillation_notebook_builder.py
          uv run --frozen ruff format scripts/teacher_distillation/build_p9_009_semantic_contract_colab_notebook.py tests/unit/test_teacher_distillation_notebook_builder.py scripts/teacher_distillation/qwen38_p9_009_semantic_contract_generation_colab.ipynb
          uv run --frozen ruff check scripts/teacher_distillation/build_p9_009_semantic_contract_colab_notebook.py tests/unit/test_teacher_distillation_notebook_builder.py
      - name: Rebuild notebook after builder formatting
        run: uv run --frozen python scripts/teacher_distillation/build_p9_009_semantic_contract_colab_notebook.py
      - name: Run focused tests
        run: uv run --frozen pytest -q tests/unit/test_teacher_distillation_notebook_builder.py tests/unit/test_teacher_semantic_contracts.py
      - name: Commit P9-009B polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/P9_009_EXECUTABLE_SEMANTIC_FILTERING.md docs/TODO.md scripts/teacher_distillation/README.md scripts/teacher_distillation/build_p9_009_semantic_contract_colab_notebook.py scripts/teacher_distillation/qwen38_p9_009_semantic_contract_generation_colab.ipynb tests/unit/test_teacher_distillation_notebook_builder.py
          if git diff --cached --quiet; then
            echo 'No polish changes required.'
            exit 0
          fi
          git commit -m 'docs: prepare P9-009B semantic-contract generation'
          git push origin HEAD:p9/semantic-contract-generation
