name: P9-004B fix UP035 import

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004b-fix-up035.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Fix UP035 and validate P9-004B
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tiny_qwen_coder/training/minimum_intervention_training.py")
          text = path.read_text(encoding="utf-8")
          old = "from dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom typing import Any, NoReturn, Sequence\n"
          new = "from collections.abc import Sequence\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom typing import Any, NoReturn\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one UP035 import anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src tests
          uv run --frozen pytest -q tests/unit/test_minimum_intervention.py tests/unit/test_minimum_intervention_training.py
          git diff --check
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/training/minimum_intervention_training.py
          git commit -m "fix: satisfy Ruff UP035 in P9-004B"
          git push origin HEAD:ralph/p9-004-minimum-intervention
