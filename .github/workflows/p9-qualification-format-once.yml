name: P9 qualification format once

on:
  push:
    branches:
      - p9/distilled-v4-2000-qualification
    paths:
      - ".github/workflows/p9-qualification-format-once.yml"
      - "src/tiny_qwen_coder/evaluation/python_distilled_qualification.py"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: p9/distilled-v4-2000-qualification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Format qualification module and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff format src/tiny_qwen_coder/evaluation/python_distilled_qualification.py
          if git diff --quiet -- src/tiny_qwen_coder/evaluation/python_distilled_qualification.py; then
            echo "Qualification module already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/evaluation/python_distilled_qualification.py
          git commit -m "style: format P9-007 qualification harness"
          git push origin HEAD:p9/distilled-v4-2000-qualification
