name: Temporary teacher-distillation reorganization

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/reorganize-teacher-distillation.yml"

permissions:
  contents: write

jobs:
  reorganize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Reorganize teacher-distillation entry points and documentation
        run: |
          set -euo pipefail
          mkdir -p scripts/teacher_distillation
          git mv scripts/prepare_teacher_input.py scripts/teacher_distillation/prepare_teacher_input.py
          git mv scripts/select_teacher_input.py scripts/teacher_distillation/select_teacher_input.py
          git mv scripts/generate_teacher_data.py scripts/teacher_distillation/generate_teacher_data.py
          git mv scripts/finalize_teacher_data.py scripts/teacher_distillation/finalize_teacher_data.py
          git mv docs/TEACHER_DISTILLATION_COLAB.md scripts/teacher_distillation/README.md

          python - <<'PY'
          from pathlib import Path

          root_path = Path("README.md")
          root = root_path.read_text(encoding="utf-8")
          runbook_path = Path("scripts/teacher_distillation/README.md")
          old_runbook = runbook_path.read_text(encoding="utf-8")

          start_marker = "## Google Colab: generate Qwen3.8-27B teacher data\n"
          end_marker = "## Quality gates\n"
          start = root.index(start_marker)
          end = root.index(end_marker, start)
          colab_section = root[start:end]

          path_replacements = {
              "scripts/prepare_teacher_input.py": "scripts/teacher_distillation/prepare_teacher_input.py",
              "scripts/select_teacher_input.py": "scripts/teacher_distillation/select_teacher_input.py",
              "scripts/generate_teacher_data.py": "scripts/teacher_distillation/generate_teacher_data.py",
              "scripts/finalize_teacher_data.py": "scripts/teacher_distillation/finalize_teacher_data.py",
          }
          for old, new in path_replacements.items():
              colab_section = colab_section.replace(old, new)

          stale_runbook_link = (
              "The cells below are written in **Colab notebook syntax** and can be copied into\n"
              "separate Python cells. For the full checkpoint/failure-recovery contract, see\n"
              "[`docs/TEACHER_DISTILLATION_COLAB.md`](docs/TEACHER_DISTILLATION_COLAB.md).\n\n"
          )
          canonical_runbook_text = (
              "The cells below are written in **Colab notebook syntax** and can be copied into\n"
              "separate Python cells. This README is the canonical checkpoint and recovery contract.\n\n"
          )
          if stale_runbook_link not in colab_section:
              raise RuntimeError("root README Colab runbook link changed unexpectedly")
          colab_section = colab_section.replace(stale_runbook_link, canonical_runbook_text, 1)

          frozen_start = old_runbook.index("## Frozen v1 contract\n")
          frozen_end = old_runbook.index("## 1. Start an A100 Colab runtime", frozen_start)
          frozen_contract = old_runbook[frozen_start:frozen_end].rstrip()
          limitations_marker = "## What v1 does and does not prove\n"
          limitations = old_runbook[old_runbook.index(limitations_marker):].rstrip()
          colab_section = colab_section.replace(
              "## Google Colab: generate Qwen3.8-27B teacher data",
              "## Google Colab runbook",
              1,
          ).rstrip()

          intro_lines = [
              "# Qwen3.8-27B teacher distillation",
              "",
              "**Start here for generating the new Python training data on Google Colab.**",
              "",
              "This directory intentionally keeps the runnable entry points and their operating",
              "instructions together. The teacher is `Qwen/Qwen3.8-27B` on a Google Colab A100;",
              "the student remains `Qwen/Qwen3.5-4B`, fine-tuned later on the RTX 4070 Ti SUPER.",
              "",
              "## Directory contents",
              "",
              "| File | Purpose |",
              "| --- | --- |",
              "| `prepare_teacher_input.py` | Build and SHA-256 seal the canonical prompt-only teacher input. |",
              "| `select_teacher_input.py` | Create deterministic source-stratified 16/500/2,000-record pilot inputs. |",
              "| `generate_teacher_data.py` | Run resumable Qwen3.8 generation with durable Google Drive checkpoints. |",
              "| `finalize_teacher_data.py` | Validate/filter completed shards and emit the Qwen3.5-4B training corpus and manifest. |",
              "| `README.md` | This Google Colab runbook and recovery contract. |",
              "",
              "All commands below are run from the **repository root** after cloning",
              "`tiny-qwen-coder`. The scripts live here so there is one obvious place to find",
              "both the workflow and its documentation.",
          ]
          runbook = (
              "\n".join(intro_lines)
              + "\n\n"
              + frozen_contract
              + "\n\n"
              + colab_section
              + "\n\n"
              + limitations
              + "\n"
          )
          runbook_path.write_text(runbook, encoding="utf-8")

          concise_lines = [
              "## Qwen3.8 teacher-data generation",
              "",
              "The Google Colab A100 teacher-distillation workflow is self-contained under",
              "[`scripts/teacher_distillation/`](scripts/teacher_distillation/README.md).",
              "",
              "Start with that directory's README. It contains the four Python entry points,",
              "copy/paste Colab instructions, Google Drive checkpoint/resume behavior, the",
              "16/500/2,000-record pilot sequence, and finalization instructions for bringing",
              "the generated corpus back to the RTX 4070 Ti training machine.",
              "",
              "```text",
              "scripts/teacher_distillation/",
              "├── README.md",
              "├── prepare_teacher_input.py",
              "├── select_teacher_input.py",
              "├── generate_teacher_data.py",
              "└── finalize_teacher_data.py",
              "```",
              "",
          ]
          root = root[:start] + "\n".join(concise_lines) + "\n" + root[end:]

          old_layout = "\n".join([
              "scripts/",
              "    inspect_model.py",
              "    prepare_data.py",
              "    train_adapter.py",
              "    evaluate.py",
              "    infer.py",
              "    serve.py",
              "",
          ])
          new_layout = "\n".join([
              "scripts/",
              "    teacher_distillation/   Qwen3.8 Colab data-generation workflow + README",
              "    inspect_model.py",
              "    prepare_data.py",
              "    train_adapter.py",
              "    evaluate.py",
              "    infer.py",
              "    serve.py",
              "",
          ])
          if old_layout not in root:
              raise RuntimeError("root README scripts layout block changed unexpectedly")
          root = root.replace(old_layout, new_layout, 1)

          old_doc_bullet = "\n".join([
              "- [`docs/TEACHER_DISTILLATION_COLAB.md`](docs/TEACHER_DISTILLATION_COLAB.md) — detailed",
              "  Qwen3.8-27B A100 distillation, checkpoint, resume, and finalization runbook.",
              "",
          ])
          new_doc_bullet = "\n".join([
              "- [`scripts/teacher_distillation/README.md`](scripts/teacher_distillation/README.md) —",
              "  Qwen3.8-27B A100 distillation scripts, Colab instructions, checkpoint/resume contract,",
              "  and finalization runbook.",
              "",
          ])
          if old_doc_bullet not in root:
              raise RuntimeError("root README teacher documentation bullet changed unexpectedly")
          root = root.replace(old_doc_bullet, new_doc_bullet, 1)
          root_path.write_text(root, encoding="utf-8")

          spec_path = Path("docs/SPEC.md")
          spec = spec_path.read_text(encoding="utf-8")
          spec_old = "\n".join([
              "├── scripts/",
              "│   ├── inspect_model.py",
              "│   ├── prepare_data.py",
              "│   ├── train_adapter.py",
              "│   ├── evaluate.py",
              "│   ├── infer.py",
              "│   └── serve.py",
              "",
          ])
          spec_new = "\n".join([
              "├── scripts/",
              "│   ├── teacher_distillation/",
              "│   │   ├── README.md",
              "│   │   ├── prepare_teacher_input.py",
              "│   │   ├── select_teacher_input.py",
              "│   │   ├── generate_teacher_data.py",
              "│   │   └── finalize_teacher_data.py",
              "│   ├── inspect_model.py",
              "│   ├── prepare_data.py",
              "│   ├── train_adapter.py",
              "│   ├── evaluate.py",
              "│   ├── infer.py",
              "│   └── serve.py",
              "",
          ])
          if spec_old not in spec:
              raise RuntimeError("SPEC scripts layout block changed unexpectedly")
          spec_path.write_text(spec.replace(spec_old, spec_new, 1), encoding="utf-8")
          PY

          if grep -R -nE 'scripts/(prepare_teacher_input|select_teacher_input|generate_teacher_data|finalize_teacher_data)\.py|docs/TEACHER_DISTILLATION_COLAB\.md' README.md docs scripts/teacher_distillation; then
            echo "stale teacher-distillation path found" >&2
            exit 1
          fi

      - name: Run full CPU quality gates
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen ruff format .
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check

      - name: Commit validated reorganization and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/reorganize-teacher-distillation.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: organize teacher distillation scripts"
          git push origin HEAD:master
