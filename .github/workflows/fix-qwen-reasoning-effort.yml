name: Fix Qwen reasoning effort contract

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Correct reasoning-effort contract
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/tiny_qwen_coder/distillation/config.py'): [
                  ('Literal["low", "medium", "xhigh"]', 'Literal["low", "high", "xhigh"]'),
                  ('{"low", "medium", "xhigh"}', '{"low", "high", "xhigh"}'),
                  ('low, medium, xhigh', 'low, high, xhigh'),
              ],
              Path('configs/distillation/python/qwen38_27b_v2.yaml'): [
                  ('reasoning_effort: medium', 'reasoning_effort: high'),
              ],
              Path('tests/unit/test_teacher_distillation_v2.py'): [
                  ('assert v2.generation.reasoning_effort == "medium"', 'assert v2.generation.reasoning_effort == "high"'),
              ],
              Path('scripts/teacher_distillation/README.md'): [
                  ('reasoning effort reduced from `xhigh` to **`medium`**', 'reasoning effort reduced from `xhigh` to **`high`**'),
                  ('The v2 diagnostic/finalization work deliberately did not change those three v1 generation-identity source files. The preserved v1 checkpoint can therefore be inspected by the new diagnostic tooling without rewriting or weakening its run identity.', 'The v2 reasoning-effort correction changes `config.py`, which is part of the generation implementation identity. Inspect preserved v1 checkpoints with the frozen v1 repository archive that created them; do not weaken or rewrite their run identity to make newer code accept them.'),
              ],
              Path('scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb'): [
                  ('from `xhigh` to `medium`', 'from `xhigh` to `high`'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise RuntimeError(f'missing expected text in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          test_path = Path('tests/unit/test_teacher_distillation_v2.py')
          text = test_path.read_text(encoding='utf-8')
          if 'test_v2_config_rejects_unsupported_medium_reasoning_effort' not in text:
              text = text.replace(
                  'from tiny_qwen_coder.distillation.config import load_teacher_distillation_config\n',
                  'from tiny_qwen_coder.distillation.config import (\n'
                  '    TeacherDistillationConfigError,\n'
                  '    load_teacher_distillation_config,\n'
                  '    parse_teacher_distillation_config,\n'
                  ')\n',
              )
              text = text.replace('import json\n', 'import json\n\nimport pytest\n')
              marker = '\n\nclass _FakeTokenizer:'
              addition = '''\n\ndef test_v2_config_rejects_unsupported_medium_reasoning_effort() -> None:\n    v2 = load_teacher_distillation_config(\n        Path("configs/distillation/python/qwen38_27b_v2.yaml")\n    )\n    payload = asdict(v2)\n    generation = payload["generation"]\n    assert isinstance(generation, dict)\n    generation["reasoning_effort"] = "medium"\n\n    with pytest.raises(TeacherDistillationConfigError, match="low, high, xhigh"):\n        parse_teacher_distillation_config(payload)\n'''
              if marker not in text:
                  raise RuntimeError('test insertion marker missing')
              text = text.replace(marker, addition + marker)
              test_path.write_text(text, encoding='utf-8')
          PY
      - name: Normalize
        run: |
          uv run --frozen ruff check --fix .
          uv run --frozen ruff format .
      - name: Validate CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check
      - name: Commit fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-qwen-reasoning-effort.yml
          git add src/tiny_qwen_coder/distillation/config.py \
                  configs/distillation/python/qwen38_27b_v2.yaml \
                  tests/unit/test_teacher_distillation_v2.py \
                  scripts/teacher_distillation/README.md \
                  scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb
          git commit -m 'fix: use supported Qwen high reasoning effort'
          git push origin HEAD:master
