name: P9-009 Format Once

on:
  push:
    branches:
      - p9/executable-semantic-filtering
    paths:
      - .github/workflows/p9-009-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Format P9-009 implementation
        run: uv run --frozen ruff format src/tiny_qwen_coder/distillation/semantic_contracts.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tiny_qwen_coder/distillation/semantic_contracts.py
          git commit -m 'style: format P9-009 semantic contracts'
          git push origin HEAD:p9/executable-semantic-filtering
