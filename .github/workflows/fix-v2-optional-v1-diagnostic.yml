name: Fix optional v1 diagnostic in v2 notebook

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-v2-optional-v1-diagnostic.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Make preserved-v1 diagnosis optional
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          target_index = None
          for index, cell in enumerate(notebook["cells"]):
              source = "".join(cell.get("source", []))
              if source.startswith("## 8. Verify and diagnose the preserved v1 2,000-candidate run"):
                  cell["source"] = [
                      "## 8. Optionally diagnose the preserved v1 2,000-candidate run\n",
                      "\n",
                      "This diagnostic is historical evidence only; it is **not a dependency of the v2 study**.\n",
                      "If the old v1 checkpoint metadata is not present on Drive, the next cell prints a warning\n",
                      "and skips the diagnostic. Continue to Step 9.\n",
                  ]
                  target_index = index + 1
                  break

          if target_index is None:
              raise RuntimeError("could not locate Step 8 markdown cell")

          cell = notebook["cells"][target_index]
          source = "".join(cell.get("source", []))
          if "required_v1 =" not in source:
              raise RuntimeError("could not locate Step 8 diagnostic code cell")

          cell["source"] = [
              "required_v1 = (\n",
              "    Path(os.environ[\"INPUT_DIR\"]) / \"accepted.jsonl\",\n",
              "    Path(os.environ[\"SUBSET_DIR\"]) / \"p0-2000.jsonl\",\n",
              "    Path(os.environ[\"V1_PILOT_DIR\"]) / \"checkpoint\" / \"run-identity.json\",\n",
              ")\n",
              "missing = [str(path) for path in required_v1 if not path.exists()]\n",
              "if missing:\n",
              "    print(\n",
              "        \"Skipping optional preserved-v1 diagnostic; missing: \"\n",
              "        + \", \".join(missing)\n",
              "    )\n",
              "    print(\"Continue to Step 9; v2 generation does not depend on this checkpoint.\")\n",
              "else:\n",
              "    run_teacher(\n",
              "        \"scripts/teacher_distillation/diagnose_teacher_data.py\",\n",
              "        \"--distillation-config\",\n",
              "        \"configs/distillation/python/qwen38_27b_v1.yaml\",\n",
              "        \"--input\",\n",
              "        str(Path(os.environ[\"SUBSET_DIR\"]) / \"p0-2000.jsonl\"),\n",
              "        \"--checkpoint-dir\",\n",
              "        str(Path(os.environ[\"V1_PILOT_DIR\"]) / \"checkpoint\"),\n",
              "        \"--output-dir\",\n",
              "        os.environ[\"V1_DIAG_DIR\"],\n",
              "    )\n",
          ]

          path.write_text(json.dumps(notebook, indent=1, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Normalize notebook
        run: uv run --frozen ruff format scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb
      - name: Validate full CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check
      - name: Commit notebook and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb
          git rm .github/workflows/fix-v2-optional-v1-diagnostic.yml
          git commit -m "fix: make preserved v1 diagnostic optional"
          git push origin HEAD:master
