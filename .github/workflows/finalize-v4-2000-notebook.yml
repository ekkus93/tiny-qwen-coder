name: Finalize v4-2000 Colab notebook

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/finalize-v4-2000-notebook.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Build v4-2000 notebook
        run: uv run --frozen python scripts/teacher_distillation/build_v4_2000_colab_notebook.py

      - name: Format generated workflow files
        run: |
          uv run --frozen ruff format \
            scripts/teacher_distillation/build_v4_2000_colab_notebook.py \
            scripts/teacher_distillation/qwen38_teacher_distillation_v4_2000_colab.ipynb
          uv run --frozen ruff check --fix scripts/teacher_distillation/build_v4_2000_colab_notebook.py

      - name: Validate full CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check

      - name: Commit finalized notebook and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v4-2000-notebook.yml
          git add -A
          git commit -m "feat: finalize v4-2000 Colab successor"
          git push origin HEAD:master
