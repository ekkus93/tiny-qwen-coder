name: P9-004B fix Trainer callback contract

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004b-fix-trainer-callback.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Fix callback inheritance and add regression test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/tiny_qwen_coder/training/minimum_intervention_training.py")
          text = source.read_text(encoding="utf-8")
          old_import = "import torch\n\nfrom tiny_qwen_coder.identities"
          new_import = "import torch\nfrom transformers import TrainerCallback\n\nfrom tiny_qwen_coder.identities"
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one source import anchor, found {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)
          old_class = "class _AdapterSnapshotCallback:\n"
          new_class = "class _AdapterSnapshotCallback(TrainerCallback):\n"
          if text.count(old_class) != 1:
              raise SystemExit(f"expected one callback class anchor, found {text.count(old_class)}")
          source.write_text(text.replace(old_class, new_class, 1), encoding="utf-8")

          test = Path("tests/unit/test_minimum_intervention_training.py")
          test_text = test.read_text(encoding="utf-8")
          test_import_old = "import pytest\n\nimport tiny_qwen_coder.training.minimum_intervention_training"
          test_import_new = "import pytest\nfrom transformers import TrainerCallback\n\nimport tiny_qwen_coder.training.minimum_intervention_training"
          if test_text.count(test_import_old) != 1:
              raise SystemExit(f"expected one test import anchor, found {test_text.count(test_import_old)}")
          test_text = test_text.replace(test_import_old, test_import_new, 1)
          anchor = "def test_snapshot_callback_saves_only_precommitted_steps(tmp_path: Path) -> None:\n"
          regression = '''def test_snapshot_callback_implements_transformers_callback_contract(tmp_path: Path) -> None:\n    root = tmp_path / "snapshots"\n    root.mkdir()\n    callback = _AdapterSnapshotCallback(\n        snapshot_root=root,\n        steps=(50, 100, 250, 500, 1000),\n    )\n\n    assert isinstance(callback, TrainerCallback)\n    for event_name in (\n        "on_train_begin",\n        "on_epoch_begin",\n        "on_step_begin",\n        "on_step_end",\n        "on_epoch_end",\n        "on_train_end",\n    ):\n        assert callable(getattr(callback, event_name))\n\n\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit(f"expected one callback test anchor, found {test_text.count(anchor)}")
          test.write_text(test_text.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src tests
          uv run --frozen pytest -q tests/unit/test_minimum_intervention.py tests/unit/test_minimum_intervention_training.py
          git diff --check
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/training/minimum_intervention_training.py tests/unit/test_minimum_intervention_training.py
          git commit -m "fix: implement Transformers callback contract for P9-004B"
          git push origin HEAD:ralph/p9-004-minimum-intervention
