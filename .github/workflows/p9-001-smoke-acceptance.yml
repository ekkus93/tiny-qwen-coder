name: P9-001 one-shot rank smoke acceptance

on:
  push:
    branches:
      - ralph/p9-001-rank-sweep
    paths:
      - ".github/workflows/p9-001-smoke-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: p9-001-one-shot-rank-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke rank ${{ matrix.rank }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rank: [8, 32, 64]

    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen QLoRA environment
        run: uv sync --frozen --extra qlora

      - name: Verify CUDA runtime
        run: |
          set -euo pipefail
          nvidia-smi
          uv run --frozen python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot access CUDA")
          if not torch.cuda.is_bf16_supported():
              raise SystemExit("CUDA device 0 does not support BF16")
          properties = torch.cuda.get_device_properties(0)
          print(f"torch={torch.__version__}")
          print(f"gpu={properties.name}")
          print(f"total_memory_bytes={properties.total_memory}")
          PY

      - name: Validate frozen rank-only protocol
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.training.rank_sweep \
            --repo-root . \
            > "${RUNNER_TEMP}/rank-sweep-validation.json"
          cat "${RUNNER_TEMP}/rank-sweep-validation.json"

      - name: Select exact rank config
        env:
          RANK: ${{ matrix.rank }}
        run: |
          set -euo pipefail
          case "${RANK}" in
            8|32|64) ;;
            *) echo "unsupported rank ${RANK}" >&2; exit 2 ;;
          esac
          echo "TRAIN_CONFIG=configs/train/python/p9_rank_r${RANK}.yaml" >> "${GITHUB_ENV}"
          echo "SMOKE_CONFIG=configs/train/python/p9_rank_r${RANK}_smoke.yaml" >> "${GITHUB_ENV}"
          echo "OUTPUT_DIR=artifacts/train/python/p9-rank-r${RANK}-smoke" >> "${GITHUB_ENV}"
          echo "EXPECTED_ADAPTER_ID=language/python/p9-rank-r${RANK}" >> "${GITHUB_ENV}"

      - name: Confirm clean source tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Materialize frozen Python P0 corpus
        run: |
          set -euo pipefail
          uv run --frozen python scripts/freeze_python_p0.py
          test -f data/python/p0/dataset-manifest.json
          test -f data/python/p0/train.jsonl
          test -f data/python/p0/validation.jsonl

      - name: Run one-step rank smoke
        run: |
          set -euo pipefail
          uv run --frozen tiny-qwen-coder-train-smoke \
            --config "${SMOKE_CONFIG}" \
            --repo-root . \
            | tee "${RUNNER_TEMP}/rank-${{ matrix.rank }}-smoke-report.json"

      - name: Verify smoke evidence
        env:
          RANK: ${{ matrix.rank }}
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          rank = int(os.environ["RANK"])
          root = Path(os.environ["OUTPUT_DIR"])
          report = json.loads((root / "smoke-training-report.json").read_text(encoding="utf-8"))
          if report.get("source_training_config") != os.environ["TRAIN_CONFIG"]:
              raise SystemExit("smoke report source config mismatch")
          if report.get("adapter_id") != os.environ["EXPECTED_ADAPTER_ID"]:
              raise SystemExit("smoke report adapter identity mismatch")
          if report.get("max_steps") != 1 or report.get("global_steps") != 1:
              raise SystemExit("smoke did not complete exactly one optimizer step")
          if report.get("smoke_only") is not True or report.get("promotable") is not False:
              raise SystemExit("smoke promotion flags are invalid")
          for key in ("training_loss", "validation_loss"):
              value = report.get(key)
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise SystemExit(f"{key} is not numeric")
              if not math.isfinite(float(value)):
                  raise SystemExit(f"{key} is not finite")
          for key in ("peak_allocated_vram_bytes", "peak_reserved_vram_bytes"):
              value = report.get(key)
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise SystemExit(f"{key} is not a positive integer")
          print(json.dumps({"rank": rank, **report}, indent=2, sort_keys=True))
          PY

      - name: Upload compact smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: p9-001-rank-r${{ matrix.rank }}-smoke-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.json
            ${{ env.OUTPUT_DIR }}/*.jsonl
            ${{ env.OUTPUT_DIR }}/*.sha256
            ${{ env.OUTPUT_DIR }}/adapter/adapter_config.json
            ${{ runner.temp }}/rank-sweep-validation.json
            ${{ runner.temp }}/rank-${{ matrix.rank }}-smoke-report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload partial smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p9-001-rank-r${{ matrix.rank }}-smoke-partial-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.json
            ${{ env.OUTPUT_DIR }}/*.jsonl
            ${{ env.OUTPUT_DIR }}/*.sha256
            ${{ runner.temp }}/rank-sweep-validation.json
            ${{ runner.temp }}/rank-${{ matrix.rank }}-smoke-report.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
