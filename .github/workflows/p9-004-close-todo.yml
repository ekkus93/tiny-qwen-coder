name: Reconcile P9-004 closure TODO

on:
  push:
    branches:
      - ralph/p9-004-minimum-intervention
    paths:
      - ".github/workflows/p9-004-close-todo.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p9-004-minimum-intervention
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Reconcile TODO
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "## P9-004 — Training-length/learning-rate study\n\n"
              "- [ ] additional epoch/step options.\n"
              "- [ ] lower/higher LR candidates.\n\n"
              "Acceptance criteria:\n\n"
              "- Overfitting/general regression explicitly measured.\n"
          )
          new = (
              "## P9-004 — Checkpointed low-LR minimum-intervention study\n\n"
              "- [x] Freeze five r8 learning-rate trajectories: `1e-5`, `2e-5`, `5e-5`, `1e-4`, `2e-4`.\n"
              "- [x] Freeze a common 1,000-step scheduler horizon and snapshots at steps 50/100/250/500/1000.\n"
              "- [x] Freeze deterministic development/qualification membership before checkpoint scoring.\n"
              "- [x] Keep the complete repository holdout qualification-only.\n"
              "- [x] Train all five trajectories and freeze exact adapter-only snapshot identities.\n"
              "- [x] Score all 25 snapshots on the frozen development slice only.\n"
              "- [x] Apply the precommitted selection policy mechanically.\n"
              "- [x] Stop without qualification because no checkpoint beat/preserved the unchanged base.\n\n"
              "Acceptance criteria:\n\n"
              "- Every trajectory differs from completed r8 only in learning rate, adapter ID, and output path.\n"
              "- All checkpoints share the same 1,000-step scheduler horizon.\n"
              "- Repeated tuning consumes only the frozen development slice, never the qualification-only repository holdout.\n"
              "- A candidate reaches qualification only if development combined passes strictly beat base with no HumanEval/MBPP development regression.\n"
              "- Qualification is winner-only and one-shot; no runner-up is tried after observing results.\n"
              "- Training/validation loss, VRAM, and throughput cannot override executable benchmark results.\n\n"
              "Implementation note: canonical development run `33950802529` scored all 25 checkpoints and mechanically selected none. "
              "The unchanged base scored `103/175`; the best checkpoint, `lr-1e-5` at step 50, scored `100/175` "
              "(`33/45` HumanEval, `67/130` MBPP). Selection evidence SHA-256 is "
              "`cc4bd3d89f8b9e9e1ebf481509c6b97ec50de7263e954247b68c30899941bc6c`; `qualification_authorized` is false "
              "and the repository holdout was not evaluated. P9-004 therefore closes as a negative experiment and further P0 "
              "rank/LR/epoch search is stopped in favor of dataset/objective redesign. Full evidence is frozen in "
              "`docs/P9_004_MINIMUM_INTERVENTION.md` and `docs/evidence/P9_004_MINIMUM_INTERVENTION_DEVELOPMENT.json`.\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one legacy P9-004 TODO block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
      - name: Commit TODO closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          git diff --cached --quiet && { echo "expected TODO change" >&2; exit 1; }
          git commit -m "P9-004: close minimum-intervention study"
          git push origin HEAD:ralph/p9-004-minimum-intervention
