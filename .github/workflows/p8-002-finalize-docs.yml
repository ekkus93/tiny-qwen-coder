name: P8-002 finalize accepted evidence

on:
  push:
    branches:
      - ralph/p8-002-general-tool-regression
    paths:
      - ".github/workflows/p8-002-finalize-docs.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p8-002-general-tool-regression
          clean: true
          fetch-depth: 1
      - name: Record accepted P8-002 evidence
        run: |
          set -euo pipefail
          python scripts/tmp_finalize_p8_002.py
          git diff --check
      - name: Commit accepted evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md docs/P8_002_GENERAL_TOOL_REGRESSION.md
          git diff --cached --check
          git commit -m "docs: record accepted P8-002 regression evidence"
          git push origin HEAD:ralph/p8-002-general-tool-regression
