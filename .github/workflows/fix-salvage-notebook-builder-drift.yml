          +    "db7b79bc585a40fcaf58bf750017e135",
          +    "916684f9a58a4a2aa5f864670399430d",
          +    "1671c31a24314836a5b85d7ef7fbf015",
          +    "33b0902fd34d4ace834912fa1002cf8e",
          +    "f6fa52606d8c4a75a9b52967216f8f3f",
          +    "f5a1fa73e5044315a093ec459c9be902",
          +    "cdf66aed5cc84ca1b48e60bad68798a8",
          +    "28d3efd5258a48a79c179ea5c6759f01",
          +    "3f9bc0b9dd2c44919cc8dcca39b469f8",
          +    "0e382214b5f147d187d36a2058b9c724",
          +    "5b09d5ef5b5e4bb6ab9b829b10b6a29f",
          +    "a50416e276a0479cbe66534ed1713a40",
          +    "46a27a456b804aa2a380d5edf15a5daf",
          +    "1944c39560714e6e80c856f20744a8e5",
          +    "d6ca27006b894b04b6fc8b79396e2797",
          +)
           
           
           def _lines(text: str) -> list[str]:
          @@ -645,6 +690,13 @@ def _notebook() -> dict[str, object]:
                       """
                   ),
               ]
          +    if len(cells) != len(CELL_IDS):
          +        raise RuntimeError(
          +            f"Notebook cell count changed: expected {len(CELL_IDS)}, found {len(cells)}"
          +        )
          +    for cell, cell_id in zip(cells, CELL_IDS, strict=True):
          +        cell["id"] = cell_id
          +
               return {
                   "cells": cells,
                   "metadata": {
          @@ -665,12 +717,31 @@ def _notebook() -> dict[str, object]:
               }
           
           
          -def main() -> None:
          -    OUTPUT.write_text(
          +def build_notebook(output: Path = OUTPUT) -> None:
          +    output.parent.mkdir(parents=True, exist_ok=True)
          +    output.write_text(
                   json.dumps(_notebook(), indent=1) + "\n",
                   encoding="utf-8",
               )
          -    print(OUTPUT)
          +
          +    ruff = shutil.which("ruff")
          +    if ruff is None:
          +        raise RuntimeError(
          +            "Ruff is required to canonicalize the generated notebook; "
          +            "run this builder inside the repository's frozen development environment."
          +        )
          +    subprocess.run(
          +        [ruff, "format", "--config", str(RUFF_CONFIG), str(output)],
          +        check=True,
          +    )
          +
          +
          +def main() -> None:
          +    parser = argparse.ArgumentParser()
          +    parser.add_argument("--output", type=Path, default=OUTPUT)
          +    args = parser.parse_args()
          +    build_notebook(args.output)
          +    print(args.output)
           
           
           if __name__ == "__main__":
          diff --git a/tests/unit/test_teacher_distillation_notebook_builder.py b/tests/unit/test_teacher_distillation_notebook_builder.py
          new file mode 100644
          index 0000000..ec417be
          --- /dev/null
          +++ b/tests/unit/test_teacher_distillation_notebook_builder.py
          @@ -0,0 +1,24 @@
          +from __future__ import annotations
          +
          +import subprocess
          +import sys
          +from pathlib import Path
          +
          +
          +def test_v4_2000_salvage_notebook_builder_matches_checked_in_artifact(
          +    tmp_path: Path,
          +) -> None:
          +    builder = Path(
          +        "scripts/teacher_distillation/build_v4_2000_salvage_colab_notebook.py"
          +    )
          +    committed = Path(
          +        "scripts/teacher_distillation/qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb"
          +    )
          +    generated = tmp_path / committed.name
          +
          +    subprocess.run(
          +        [sys.executable, str(builder), "--output", str(generated)],
          +        check=True,
          +    )
          +
          +    assert generated.read_bytes() == committed.read_bytes()
          PATCH
          git apply /tmp/fix.patch

      - name: Prove notebook rebuild is byte-identical
        run: |
          uv run --frozen python scripts/teacher_distillation/build_v4_2000_salvage_colab_notebook.py \
            --output /tmp/qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb
          cmp \
            /tmp/qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb \
            scripts/teacher_distillation/qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb

      - name: Validate full CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check

      - name: Commit finalized hardening
        run: |
          rm .github/workflows/fix-salvage-notebook-builder-drift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make salvage notebook rebuild deterministic"
          git push origin HEAD:fix/salvage-notebook-builder-drift
