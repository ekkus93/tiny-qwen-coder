name: Finalize salvage notebook builder drift fix

on:
  push:
    branches:
      - fix/salvage-notebook-builder-drift
    paths:
      - ".github/workflows/fix-salvage-notebook-builder-drift.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/salvage-notebook-builder-drift

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Apply deterministic builder patch
        run: |
          cat > /tmp/fix.patch <<'PATCH'
          diff --git a/scripts/teacher_distillation/README.md b/scripts/teacher_distillation/README.md
          index ba0030a..5644ed8 100644
          --- a/scripts/teacher_distillation/README.md
          +++ b/scripts/teacher_distillation/README.md
          @@ -29,7 +29,7 @@ For unrelated future bounded teacher-data experiments, the preserved v4 notebook
           | `qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb` | Current executable repair workflow for the affected completed v4-2000 generation evidence. |
           | `build_v4_colab_notebook.py` | Deterministically rebuild the bounded v4 notebook from stdlib-only source. |
           | `build_v4_2000_colab_notebook.py` | Deterministically rebuild the preserved first v4-2000 successor notebook. |
          -| `build_v4_2000_salvage_colab_notebook.py` | Deterministically rebuild the v4-2000 salvage notebook. |
          +| `build_v4_2000_salvage_colab_notebook.py` | Deterministically rebuild and repository-Ruff-canonicalize the v4-2000 salvage notebook. |
           | `prepare_teacher_input.py` | Build and SHA-256 seal the canonical prompt-only teacher input. |
           | `select_teacher_input.py` | Create deterministic source-stratified subsets. |
           | `prepare_teacher_v2_input.py` | Add and SHA-256 bind the teacher-only concise-answer v2 policy. |
          diff --git a/scripts/teacher_distillation/build_v4_2000_salvage_colab_notebook.py b/scripts/teacher_distillation/build_v4_2000_salvage_colab_notebook.py
          index 55d85df..2417359 100644
          --- a/scripts/teacher_distillation/build_v4_2000_salvage_colab_notebook.py
          +++ b/scripts/teacher_distillation/build_v4_2000_salvage_colab_notebook.py
          @@ -3,13 +3,58 @@
           
           from __future__ import annotations
           
          +import argparse
           import json
          +import shutil
          +import subprocess
           import textwrap
           from pathlib import Path
           
          +REPO_ROOT = Path(__file__).resolve().parents[2]
           OUTPUT = Path(
               "scripts/teacher_distillation/qwen38_teacher_distillation_v4_2000_salvage_colab.ipynb"
           )
          +RUFF_CONFIG = REPO_ROOT / "pyproject.toml"
          +CELL_IDS = (
          +    "7fb27b941602401d91542211134fc71a",
          +    "acae54e37e7d407bbb7b55eff062a284",
          +    "9a63283cbaf04dbcab1f6479b197f3a8",
