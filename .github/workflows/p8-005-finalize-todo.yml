name: P8-005 finalize TODO

on:
  push:
    branches:
      - ralph/p8-005-p0-promotion-decision
    paths:
      - ".github/workflows/p8-005-finalize-todo.yml"

permissions:
  contents: write

concurrency:
  group: p8-005-finalize-todo
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ralph/p8-005-p0-promotion-decision
          fetch-depth: 1

      - name: Update exact P8-005 TODO block fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path("docs/TODO.md")
          before = path.read_bytes()
          expected_before = "0083510cbad8b1dcd7d965c6ec4be48d5997239a27962790204360ec94d7b3de"
          actual_before = hashlib.sha256(before).hexdigest()
          if actual_before != expected_before:
              raise SystemExit(
                  f"TODO preimage SHA mismatch: expected {expected_before}, got {actual_before}"
              )

          old = '''## P8-005 — Promote or reject P0 adapter

          - [ ] Establish quantitative promotion thresholds using actual baseline evidence.
          - [ ] Mark recommended Python adapter ID if accepted.
          - [ ] Preserve rejected experiment metadata.

          Acceptance criteria:

          - "Recommended" has an explicit evidentiary meaning.
          '''
          new = '''## P8-005 — Promote or reject P0 adapter

          - [x] Establish quantitative promotion thresholds using actual baseline evidence.
          - [x] Mark recommended Python adapter ID if accepted.
          - [x] Preserve rejected experiment metadata.

          Acceptance criteria:

          - "Recommended" has an explicit evidentiary meaning.

          Implementation note: `python-promotion-v1` freezes a fail-closed promotion policy against the accepted P6-005 baseline. A candidate must reach at least `438/675` combined Python passes (the smallest discrete score at least two percentage points above the `424/675` base), must not fall below base on HumanEval/MBPP/repository holdout, must preserve the frozen general/tool passes with zero regressions, must avoid catastrophic TypeScript/Rust semantic collapse, must have `clean` contamination evidence, and must pass adapter-load validation. `language/python/p0` fails the combined, all three Python-suite preservation, and contamination-evidence gates, so `docs/evidence/P8_005_P0_PROMOTION_DECISION.json` records `disposition: reject` and `recommended_adapter_id: null`. The exact rejected adapter/evidence remains preserved as the Phase 9 negative control.
          '''

          text = before.decode("utf-8")
          if text.count(old) != 1:
              raise SystemExit("expected exactly one unchanged P8-005 TODO block")
          after = text.replace(old, new, 1).encode("utf-8")
          expected_after = "be5661c85c696cbd3f2c7d4c8c2ac36436c88767ada0bca28bfa908ff4dbe880"
          actual_after = hashlib.sha256(after).hexdigest()
          if actual_after != expected_after:
              raise SystemExit(
                  f"TODO postimage SHA mismatch: expected {expected_after}, got {actual_after}"
              )
          path.write_bytes(after)
          PY
          git diff --check
          git diff --exit-code -- . ':(exclude)docs/TODO.md'
          git diff -- docs/TODO.md

      - name: Commit exact TODO closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          git diff --cached --check
          git commit -m "docs: close P8-005 promotion decision"
          git push origin HEAD:ralph/p8-005-p0-promotion-decision
