name: Finalize bounded v2 Colab notebook

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/finalize-v2-notebook.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Sync frozen environment
        run: uv sync --frozen
      - name: Generate dedicated v2 Colab notebook
        run: |
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          def source(text: str) -> list[str]:
              return textwrap.dedent(text).lstrip("\n").splitlines(keepends=True)

          def markdown(text: str) -> dict[str, object]:
              return {"cell_type": "markdown", "metadata": {}, "source": source(text)}

          def code(text: str) -> dict[str, object]:
              return {
                  "cell_type": "code",
                  "execution_count": None,
                  "metadata": {},
                  "outputs": [],
                  "source": source(text),
              }

          cells: list[dict[str, object]] = [
              markdown(
                  '''
                  # Qwen3.8-27B bounded v2 teacher study on Google Colab

                  This is the current successor workflow after the preserved native-BF16 v1
                  2,000-candidate run showed severe length attrition. The v1 checkpoint remains
                  scientific evidence; this notebook does **not** mutate it.

                  The bounded v2 study keeps the pinned `Qwen/Qwen3.8-27B` teacher, native BF16
                  weights, vLLM 0.28.0, 16,384-token context, 8,192-token generation cap, sampling
                  parameters, seed, and 16-record durable shard size. It changes reasoning effort
                  from `xhigh` to `medium` and adds a SHA-bound teacher-only concise-answer policy.

                  The first v2 generation is **200 records**, not 2,000. Scaling is mechanically
                  blocked unless the study achieves at least 90% normal stops, at least 80% student
                  2,048-token acceptance among normal stops, and a clean protected-benchmark
                  contamination result.
                  '''
              ),
              markdown(
                  '''
                  ## 1. Mount Google Drive

                  Select an **A100 80 GB** runtime before running this notebook.
                  '''
              ),
              code(
                  '''
                  from google.colab import drive

                  drive.mount("/content/drive")
                  '''
              ),
              markdown(
                  '''
                  ## 2. Define durable v1 evidence and fresh v2 paths

                  The existing v1 input/subset/checkpoint paths are read-only evidence here. v2
                  gets a separate source ZIP and checkpoint namespace.
                  '''
              ),
              code(
                  '''
                  import os
                  from pathlib import Path

                  os.environ["TQC_DRIVE"] = "/content/drive/MyDrive/tiny-qwen-coder"
                  os.environ["CODE_DIR"] = f"{os.environ['TQC_DRIVE']}/code"
                  os.environ["CODE_ARCHIVE"] = (
                      f"{os.environ['CODE_DIR']}/tiny-qwen-coder-v2.zip"
                  )

                  os.environ["V1_RUN_ROOT"] = (
                      f"{os.environ['TQC_DRIVE']}/distillation/qwen38-27b-v1"
                  )
                  os.environ["INPUT_DIR"] = f"{os.environ['V1_RUN_ROOT']}/input"
                  os.environ["SUBSET_DIR"] = f"{os.environ['V1_RUN_ROOT']}/subsets"
                  os.environ["V1_PILOT_DIR"] = (
                      f"{os.environ['TQC_DRIVE']}/distillation/qwen38-27b-v1-2000"
                  )
                  os.environ["V1_DIAG_DIR"] = (
                      f"{os.environ['V1_PILOT_DIR']}/diagnostics-v2-analysis"
                  )

                  os.environ["V2_DIR"] = (
                      f"{os.environ['TQC_DRIVE']}/distillation/qwen38-27b-v2-200"
                  )
                  os.environ["V2_INPUT_DIR"] = f"{os.environ['V2_DIR']}/input"
                  os.environ["V2_SOURCE_INPUT"] = (
                      f"{os.environ['V2_INPUT_DIR']}/p0-200.jsonl"
                  )
                  os.environ["V2_INPUT"] = (
                      f"{os.environ['V2_INPUT_DIR']}/p0-200-v2.jsonl"
                  )
                  os.environ["V2_CHECKPOINT_DIR"] = f"{os.environ['V2_DIR']}/checkpoint"
                  os.environ["V2_DIAG_DIR"] = f"{os.environ['V2_DIR']}/diagnostics"
                  os.environ["V2_FINAL_DIR"] = f"{os.environ['V2_DIR']}/final"
                  os.environ["V2_QUALIFICATION"] = (
                      f"{os.environ['V2_DIR']}/qualification.json"
                  )

                  for key in (
                      "CODE_DIR",
                      "V1_DIAG_DIR",
                      "V2_DIR",
                      "V2_INPUT_DIR",
                      "V2_CHECKPOINT_DIR",
                      "V2_DIAG_DIR",
                      "V2_FINAL_DIR",
                  ):
                      Path(os.environ[key]).mkdir(parents=True, exist_ok=True)

                  print("v2 repository ZIP:", os.environ["CODE_ARCHIVE"])
                  print("preserved v1 pilot:", os.environ["V1_PILOT_DIR"])
                  print("fresh v2 study:", os.environ["V2_DIR"])
                  '''
              ),
              markdown(
                  '''
                  ## 3. Put the frozen v2 repository ZIP on Drive

                  Upload the exact repository ZIP you intend to use as:

                  `MyDrive/tiny-qwen-coder/code/tiny-qwen-coder-v2.zip`

                  Do not overwrite the preserved v1 ZIP. Once v2 generation starts, do not replace
                  this v2 ZIP either; resume with exactly the same bytes.
                  '''
              ),
              code(
                  '''
                  from pathlib import Path

                  archive = Path(os.environ["CODE_ARCHIVE"])
                  if archive.exists():
                      print("Repository ZIP already exists:", archive)
                  else:
                      from google.colab import files

                      uploaded = files.upload()
                      if len(uploaded) != 1:
                          raise RuntimeError("Upload exactly one repository ZIP.")
                      uploaded_name, uploaded_bytes = next(iter(uploaded.items()))
                      if not uploaded_name.lower().endswith(".zip"):
                          raise RuntimeError("The uploaded file must be a .zip archive.")
                      archive.write_bytes(uploaded_bytes)
                      print("Saved repository ZIP to:", archive)
                  '''
              ),
              markdown(
                  '''
                  ## 4. Verify, seal, and extract the frozen v2 ZIP

                  The first run writes `tiny-qwen-coder-v2.zip.sha256`. Later allocations must
                  match it exactly. A deterministic local Git commit is created only for manifest
                  provenance; no remote or GitHub credentials are configured.
                  '''
              ),
              code(
                  '''
                  import hashlib
                  import shutil
                  import subprocess
                  from pathlib import Path
                  from zipfile import ZipFile

                  archive = Path(os.environ["CODE_ARCHIVE"])
                  if not archive.is_file():
                      raise FileNotFoundError(f"Repository ZIP not found: {archive}")


                  def sha256_file(path: Path) -> str:
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                              digest.update(chunk)
                      return digest.hexdigest()


                  archive_sha256 = sha256_file(archive)
                  checksum_path = archive.with_suffix(archive.suffix + ".sha256")
                  if checksum_path.exists():
                      expected_sha256 = checksum_path.read_text(encoding="ascii").split()[0]
                      if archive_sha256 != expected_sha256:
                          raise RuntimeError(
                              "v2 repository ZIP checksum changed; use the sealed archive or a new experiment namespace"
                          )
                  else:
                      checksum_path.write_text(
                          f"{archive_sha256}  {archive.name}\n", encoding="ascii"
                      )

                  scratch_root = Path("/content/tiny-qwen-coder-v2-code")
                  if scratch_root.exists():
                      shutil.rmtree(scratch_root)
                  scratch_root.mkdir(parents=True)
                  with ZipFile(archive) as zip_file:
                      zip_file.extractall(scratch_root)

                  repo_candidates = sorted(
                      {
                          pyproject.parent
                          for pyproject in scratch_root.rglob("pyproject.toml")
                          if (
                              pyproject.parent
                              / "scripts/teacher_distillation/README.md"
                          ).is_file()
                      }
                  )
                  if len(repo_candidates) != 1:
                      raise RuntimeError(
                          "Expected exactly one tiny-qwen-coder repository in the ZIP; "
                          f"found {len(repo_candidates)} candidates."
                      )

                  repo = repo_candidates[0]
                  os.environ["TQC_REPO"] = str(repo)
                  os.environ["TQC_CODE_ARCHIVE_SHA256"] = archive_sha256

                  git_env = os.environ.copy()
                  git_env.update(
                      {
                          "GIT_AUTHOR_NAME": "Tiny Qwen Coder Archive",
                          "GIT_AUTHOR_EMAIL": "archive@tiny-qwen-coder.invalid",
                          "GIT_COMMITTER_NAME": "Tiny Qwen Coder Archive",
                          "GIT_COMMITTER_EMAIL": "archive@tiny-qwen-coder.invalid",
                          "GIT_AUTHOR_DATE": "2000-01-01T00:00:00+00:00",
                          "GIT_COMMITTER_DATE": "2000-01-01T00:00:00+00:00",
                      }
                  )
                  subprocess.run(
                      ["git", "init", "--quiet"], cwd=repo, check=True, env=git_env
                  )
                  subprocess.run(
                      ["git", "-c", "core.autocrlf=false", "add", "--all"],
                      cwd=repo,
                      check=True,
                      env=git_env,
                  )
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "--quiet",
                          "--no-gpg-sign",
                          "-m",
                          f"Frozen repository archive sha256:{archive_sha256}",
                      ],
                      cwd=repo,
                      check=True,
                      env=git_env,
                  )
                  archive_git_sha = subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], cwd=repo, text=True, env=git_env
                  ).strip()
                  if subprocess.check_output(
                      ["git", "status", "--porcelain"],
                      cwd=repo,
                      text=True,
                      env=git_env,
                  ).strip():
                      raise RuntimeError("Extracted repository is dirty after provenance commit.")
                  os.environ["TQC_ARCHIVE_GIT_SHA"] = archive_git_sha

                  print("repository:", repo)
                  print("archive SHA-256:", archive_sha256)
                  print("archive provenance Git SHA:", archive_git_sha)
                  print("checksum:", checksum_path)
                  '''
              ),
              markdown(
                  '''
                  ## 5. Create the isolated uv/vLLM CUDA 13.0 environment

                  Do not use Colab's system PyTorch for teacher inference. This recreates the
                  disposable environment under `/content` and installs the frozen runtime with the
                  CUDA 13.0 uv backend.
                  '''
              ),
              code(
                  '''
                  import os
                  import shutil
                  import subprocess
                  import sys
                  from pathlib import Path

                  os.chdir(os.environ["TQC_REPO"])
                  print("working directory:", os.getcwd())

                  subprocess.run(
                      [sys.executable, "-m", "pip", "install", "--upgrade", "uv"],
                      check=True,
                  )
                  uv_executable = shutil.which("uv")
                  if uv_executable is None:
                      raise RuntimeError("uv was installed but is not on PATH.")

                  venv = Path("/content/tqc-teacher-venv")
                  if venv.exists():
                      shutil.rmtree(venv)
                  subprocess.run(
                      [uv_executable, "venv", str(venv), "--python", sys.executable],
                      check=True,
                  )

                  os.environ["TQC_UV"] = uv_executable
                  os.environ["TQC_VENV"] = str(venv)
                  os.environ["TQC_PYTHON"] = str(venv / "bin" / "python")
                  os.environ["PATH"] = f"{venv / 'bin'}{os.pathsep}{os.environ['PATH']}"


                  def run_uv(args: list[str]) -> None:
                      command = [os.environ["TQC_UV"], *args]
                      print("$", " ".join(command), flush=True)
                      result = subprocess.run(
                          command,
                          check=False,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True,
                      )
                      print(result.stdout, end="", flush=True)
                      result.check_returncode()


                  run_uv(
                      [
                          "pip",
                          "install",
                          "--python",
                          os.environ["TQC_PYTHON"],
                          "--torch-backend=cu130",
                          "-r",
                          "requirements/colab-teacher.txt",
                          "-e",
                          ".",
                      ]
                  )
                  '''
              ),
              markdown(
                  '''
                  ## 6. Verify the A100 and isolated runtime

                  This fails closed if CUDA is unavailable, PyTorch is not using CUDA 13.0, vLLM
                  is not 0.28.0, or the assigned GPU is not an A100-class device.
                  '''
              ),
              code(
                  '''
                  import subprocess
                  import textwrap

                  subprocess.run(["nvidia-smi"], check=True)

                  verification_code = textwrap.dedent(
                      """
                      import shutil
                      import subprocess
                      import sys

                      import torch
                      import vllm

                      print("python:", sys.executable, flush=True)
                      print("torch:", torch.__version__, flush=True)
                      print("torch CUDA:", torch.version.cuda, flush=True)
                      print("vllm:", vllm.__version__, flush=True)
                      ninja = shutil.which("ninja")
                      print("ninja:", ninja or "MISSING", flush=True)
                      if ninja is None:
                          raise RuntimeError("Ninja is not available on PATH.")
                      print(
                          "ninja version:",
                          subprocess.check_output([ninja, "--version"], text=True).strip(),
                          flush=True,
                      )
                      if not torch.cuda.is_available():
                          raise RuntimeError("CUDA GPU is not available.")
                      gpu = torch.cuda.get_device_name(0)
                      print("gpu:", gpu, flush=True)
                      print(
                          "gpu memory GiB:",
                          torch.cuda.get_device_properties(0).total_memory / (1024**3),
                          flush=True,
                      )
                      if "A100" not in gpu:
                          raise RuntimeError(f"Expected an A100 runtime, found {gpu!r}.")
                      if torch.version.cuda != "13.0":
                          raise RuntimeError(
                              f"Expected PyTorch CUDA 13.0, found {torch.version.cuda!r}."
                          )
                      if vllm.__version__ != "0.28.0":
                          raise RuntimeError(f"Unexpected vLLM version: {vllm.__version__}")
                      """
                  )
                  result = subprocess.run(
                      [os.environ["TQC_PYTHON"], "-c", verification_code],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  print(result.stdout, end="", flush=True)
                  result.check_returncode()
                  '''
              ),
              markdown(
                  '''
                  ## 7. Verify the preserved v1 evidence exists

                  The v2 notebook does not recreate the old input or checkpoint. Missing v1 files
                  are an evidence problem and must be resolved rather than silently regenerated.
                  '''
              ),
              code(
                  '''
                  from pathlib import Path

                  required_v1 = (
                      Path(os.environ["INPUT_DIR"]) / "accepted.jsonl",
                      Path(os.environ["SUBSET_DIR"]) / "p0-2000.jsonl",
                      Path(os.environ["V1_PILOT_DIR"]) / "checkpoint" / "run-identity.json",
                  )
                  missing = [str(path) for path in required_v1 if not path.exists()]
                  if missing:
                      raise FileNotFoundError(
                          "Preserved v1 evidence is incomplete; missing: " + ", ".join(missing)
                      )
                  for path in required_v1:
                      print("found:", path)
                  '''
              ),
              markdown(
                  '''
                  ## 8. Diagnose the preserved v1 2,000-candidate run

                  This validates the old durable checkpoint using the unchanged generation identity
                  and records where its token budget went. Hidden reasoning text is never emitted.
                  '''
              ),
              code(
                  '''
                  subprocess.run(
                      [
                          os.environ["TQC_PYTHON"],
                          "scripts/teacher_distillation/diagnose_teacher_data.py",
                          "--distillation-config",
                          "configs/distillation/python/qwen38_27b_v1.yaml",
                          "--input",
                          str(Path(os.environ["SUBSET_DIR"]) / "p0-2000.jsonl"),
                          "--checkpoint-dir",
                          str(Path(os.environ["V1_PILOT_DIR"]) / "checkpoint"),
                          "--output-dir",
                          os.environ["V1_DIAG_DIR"],
                      ],
                      check=True,
                  )
                  '''
              ),
              markdown(
                  '''
                  ## 9. Build and seal the deterministic 200-record v2 input

                  A fresh deterministic 200-record source-stratified subset is selected from the
                  already sealed v1 accepted input. The teacher-only concise-answer policy is then
                  applied and SHA-256 sealed. Existing sealed v2 input is verified and reused.
                  '''
              ),
              code(
                  '''
                  import hashlib
                  import subprocess
                  from pathlib import Path


                  def file_sha256(path: Path) -> str:
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                              digest.update(chunk)
                      return digest.hexdigest()


                  v2_input = Path(os.environ["V2_INPUT"])
                  v2_sidecar = v2_input.with_suffix(v2_input.suffix + ".sha256")
                  if v2_input.exists() or v2_sidecar.exists():
                      if not v2_input.is_file() or not v2_sidecar.is_file():
                          raise RuntimeError(
                              "v2 input payload/sidecar pair is incomplete; do not guess at recovery"
                          )
                      expected = v2_sidecar.read_text(encoding="ascii").split()[0]
                      actual = file_sha256(v2_input)
                      if actual != expected:
                          raise RuntimeError("existing v2 input checksum mismatch")
                      print("Reusing sealed v2 input:", v2_input)
                      print("SHA-256:", actual)
                  else:
                      subprocess.run(
                          [
                              os.environ["TQC_PYTHON"],
                              "scripts/teacher_distillation/select_teacher_input.py",
                              "--input",
                              str(Path(os.environ["INPUT_DIR"]) / "accepted.jsonl"),
                              "--output",
                              os.environ["V2_SOURCE_INPUT"],
                              "--count",
                              "200",
                          ],
                          check=True,
                      )
                      subprocess.run(
                          [
                              os.environ["TQC_PYTHON"],
                              "scripts/teacher_distillation/prepare_teacher_v2_input.py",
                              "--input",
                              os.environ["V2_SOURCE_INPUT"],
                              "--output",
                              os.environ["V2_INPUT"],
                          ],
                          check=True,
                      )
                  '''
              ),
              markdown(
                  '''
                  ## 10. Verify the frozen v2 generation contract before spending GPU time
                  '''
              ),
              code(
                  '''
                  from tiny_qwen_coder.distillation.config import load_teacher_distillation_config

                  v2_config = load_teacher_distillation_config(
                      Path("configs/distillation/python/qwen38_27b_v2.yaml")
                  )
                  assert v2_config.teacher.repository == "Qwen/Qwen3.8-27B"
                  assert v2_config.teacher.dtype == "bfloat16"
                  assert v2_config.teacher.quantization == "none"
                  assert v2_config.teacher.max_model_len == 16384
                  assert v2_config.generation.reasoning_effort == "medium"
                  assert v2_config.generation.max_tokens == 8192
                  assert v2_config.checkpoint.shard_size == 16
                  print(v2_config)
                  '''
              ),
              markdown(
                  '''
                  ## 11. Generate or resume the bounded 200-record v2 study

                  This is the only cell here that loads the Qwen3.8-27B teacher. It uses a fresh v2
                  checkpoint namespace. Re-running verifies and skips already sealed shards.
                  '''
              ),
              code(
                  '''
                  subprocess.run(
                      [
                          os.environ["TQC_PYTHON"],
                          "scripts/teacher_distillation/generate_teacher_data.py",
                          "--config",
                          "configs/distillation/python/qwen38_27b_v2.yaml",
                          "--input",
                          os.environ["V2_INPUT"],
                          "--checkpoint-dir",
                          os.environ["V2_CHECKPOINT_DIR"],
                          "--work-dir",
                          "/content/tqc-distillation-v2-200",
                      ],
                      check=True,
                  )
                  '''
              ),
              markdown(
                  '''
                  ## 12. Verify the durable v2 checkpoint without loading the teacher
                  '''
              ),
              code(
                  '''
                  subprocess.run(
                      [
                          os.environ["TQC_PYTHON"],
                          "scripts/teacher_distillation/generate_teacher_data.py",
                          "--config",
                          "configs/distillation/python/qwen38_27b_v2.yaml",
                          "--input",
                          os.environ["V2_INPUT"],
                          "--checkpoint-dir",
                          os.environ["V2_CHECKPOINT_DIR"],
                          "--work-dir",
                          "/content/tqc-distillation-v2-200",
                          "--status-only",
                      ],
                      check=True,
                  )
                  '''
              ),
              markdown(
                  '''
                  ## 13. Diagnose v2 against the actual student conversation

                  The teacher-only concise policy is stripped before student token counts are
                  measured. Only reasoning character counts/digests exist; hidden reasoning text is
                  not written to diagnostics.
                  '''
              ),
              code(
                  '''
                  subprocess.run(
                      [
                          os.environ["TQC_PYTHON"],
                          "scripts/teacher_distillation/diagnose_teacher_data.py",
                          "--distillation-config",
                          "configs/distillation/python/qwen38_27b_v2.yaml",
                          "--input",
                          os.environ["V2_INPUT"],
                          "--checkpoint-dir",
                          os.environ["V2_CHECKPOINT_DIR"],
                          "--output-dir",
                          os.environ["V2_DIAG_DIR"],
                      ],
                      check=True,
                  )
                  '''
              ),
              markdown(
                  '''
                  ## 14. Finalize v2 and run fail-closed protected benchmark contamination checks

                  Finalization loads HumanEval, MBPP, and the repository holdout only after teacher
                  generation. It refuses to emit training files unless the contamination result is
                  clean. The teacher-only v2 instruction is stripped before corpus writing.
                  '''
              ),
              code(
                  '''
                  subprocess.run(
                      [
                          os.environ["TQC_PYTHON"],
                          "scripts/teacher_distillation/finalize_teacher_data.py",
                          "--distillation-config",
                          "configs/distillation/python/qwen38_27b_v2.yaml",
                          "--data-config",
                          "configs/data/python/qwen38_27b_distilled_v2.yaml",
                          "--input",
                          os.environ["V2_INPUT"],
                          "--checkpoint-dir",
                          os.environ["V2_CHECKPOINT_DIR"],
                          "--output-dir",
                          os.environ["V2_FINAL_DIR"],
                      ],
                      check=True,
                  )
                  '''
              ),
              markdown(
                  '''
                  ## 15. Mechanically qualify the bounded study

                  The command writes `qualification.json`. A nonzero return code means **do not
                  scale**. The file still records which gate failed.
                  '''
              ),
              code(
                  '''
                  qualification = subprocess.run(
                      [
                          os.environ["TQC_PYTHON"],
                          "scripts/teacher_distillation/qualify_teacher_study.py",
                          "--diagnostics-summary",
                          str(Path(os.environ["V2_DIAG_DIR"]) / "teacher-length-summary.json"),
                          "--dataset-manifest",
                          str(Path(os.environ["V2_FINAL_DIR"]) / "dataset-manifest.json"),
                          "--output",
                          os.environ["V2_QUALIFICATION"],
                      ],
                      check=False,
                  )
                  print("qualification exit code:", qualification.returncode)
                  '''
              ),
              markdown(
                  '''
                  ## 16. Inspect the scaling decision
                  '''
              ),
              code(
                  '''
                  import json

                  qualification_path = Path(os.environ["V2_QUALIFICATION"])
                  if not qualification_path.is_file():
                      raise FileNotFoundError("qualification.json was not written")
                  decision = json.loads(qualification_path.read_text(encoding="utf-8"))
                  print(json.dumps(decision, indent=2, sort_keys=True))
                  if decision.get("qualified") is not True:
                      print("\nDO NOT SCALE. Revise the generation policy and run another bounded study.")
                  else:
                      print("\nQUALIFIED. A fresh 2,000-record v2 experiment may now be prepared.")
                  '''
              ),
              markdown(
                  '''
                  ## 17. Scaling guard

                  Run this cell before preparing any 2,000-record successor. It intentionally raises
                  when the bounded study did not qualify. This notebook does not automatically spend
                  GPU time on the 2,000-record run.
                  '''
              ),
              code(
                  '''
                  if decision.get("qualified") is not True:
                      raise RuntimeError(
                          "v2-200 did not qualify; 2,000-record generation is mechanically blocked"
                      )
                  print("v2-200 qualified; stop here and preserve this evidence before scaling.")
                  '''
              ),
          ]

          notebook = {
              "cells": cells,
              "metadata": {
                  "accelerator": "GPU",
                  "colab": {
                      "name": "qwen38_teacher_distillation_v2_colab.ipynb",
                      "provenance": [],
                  },
                  "kernelspec": {
