name: Finalize bounded v2 Colab notebook

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/finalize-v2-notebook.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Sync frozen environment
        run: uv sync --frozen
      - name: Generate dedicated v2 Colab notebook
        run: |
          python - <<'PY'
          import ast
          import copy
          import json
          from pathlib import Path

          def lines(*values: str) -> list[str]:
              return [f"{value}\n" for value in values]

          def markdown(*values: str) -> dict[str, object]:
              return {
                  "cell_type": "markdown",
                  "metadata": {},
                  "source": lines(*values),
              }

          def code(*values: str) -> dict[str, object]:
              source = lines(*values)
              ast.parse("".join(source))
              return {
                  "cell_type": "code",
                  "execution_count": None,
                  "metadata": {},
                  "outputs": [],
                  "source": source,
              }

          base_path = Path(
              "scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb"
          )
          base = json.loads(base_path.read_text(encoding="utf-8"))

          # Reuse the already validated v1 setup cells: Drive mount, frozen-ZIP
          # extraction/provenance, isolated uv environment, and A100/vLLM checks.
          setup_cells = copy.deepcopy(base["cells"][1:14])
          for cell in setup_cells:
              cell["source"] = [
                  part.replace("tiny-qwen-coder.zip", "tiny-qwen-coder-v2.zip")
                  for part in cell.get("source", [])
              ]

          cells: list[dict[str, object]] = [
              markdown(
                  "# Qwen3.8-27B bounded v2 teacher study on Google Colab",
                  "",
                  "This is the successor workflow after the preserved native-BF16 v1",
                  "2,000-candidate run showed severe length attrition. The v1 checkpoint",
                  "remains scientific evidence and is never mutated by this notebook.",
                  "",
                  "v2 keeps the pinned Qwen3.8-27B teacher, native BF16 weights, vLLM",
                  "0.28.0, 16,384-token context, 8,192-token generation cap, sampling",
                  "parameters, seed, and 16-record shard size. Reasoning effort changes",
                  "from `xhigh` to `medium`, and a SHA-bound teacher-only concise-answer",
                  "policy is added.",
                  "",
                  "The first v2 generation is 200 records. Do not scale to 2,000 unless",
                  "the mechanical qualification gates pass.",
              ),
              *setup_cells,
              markdown(
                  "## 7. Define preserved v1 evidence and fresh v2 study paths",
                  "",
                  "The v1 input/subset/checkpoint remain read-only evidence. v2 uses a",
                  "new input, checkpoint, diagnostics, finalization, and qualification",
                  "namespace.",
              ),
              code(
                  "import os",
                  "import shlex",
                  "import subprocess",
                  "from pathlib import Path",
                  "",
                  "os.environ['V1_PILOT_DIR'] = os.environ['PILOT_DIR']",
                  "os.environ['V1_DIAG_DIR'] = (",
                  "    f\"{os.environ['V1_PILOT_DIR']}/diagnostics-v2-analysis\"",
                  ")",
                  "os.environ['V2_DIR'] = (",
                  "    f\"{os.environ['TQC_DRIVE']}/distillation/qwen38-27b-v2-200\"",
                  ")",
                  "os.environ['V2_INPUT_DIR'] = f\"{os.environ['V2_DIR']}/input\"",
                  "os.environ['V2_SOURCE_INPUT'] = (",
                  "    f\"{os.environ['V2_INPUT_DIR']}/p0-200.jsonl\"",
                  ")",
                  "os.environ['V2_INPUT'] = (",
                  "    f\"{os.environ['V2_INPUT_DIR']}/p0-200-v2.jsonl\"",
                  ")",
                  "os.environ['V2_CHECKPOINT_DIR'] = f\"{os.environ['V2_DIR']}/checkpoint\"",
                  "os.environ['V2_DIAG_DIR'] = f\"{os.environ['V2_DIR']}/diagnostics\"",
                  "os.environ['V2_FINAL_DIR'] = f\"{os.environ['V2_DIR']}/final\"",
                  "os.environ['V2_QUALIFICATION'] = (",
                  "    f\"{os.environ['V2_DIR']}/qualification.json\"",
                  ")",
                  "",
                  "for key in (",
                  "    'V1_DIAG_DIR',",
                  "    'V2_DIR',",
                  "    'V2_INPUT_DIR',",
                  "    'V2_CHECKPOINT_DIR',",
                  "    'V2_DIAG_DIR',",
                  "    'V2_FINAL_DIR',",
                  "):",
                  "    Path(os.environ[key]).mkdir(parents=True, exist_ok=True)",
                  "",
                  "def run_teacher(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:",
                  "    command = [os.environ['TQC_PYTHON'], *args]",
                  "    print('$', shlex.join(command), flush=True)",
                  "    return subprocess.run(command, check=check, text=True)",
                  "",
                  "print('preserved v1 pilot:', os.environ['V1_PILOT_DIR'])",
                  "print('fresh v2 study:', os.environ['V2_DIR'])",
              ),
              markdown(
                  "## 8. Verify and diagnose the preserved v1 2,000-candidate run",
                  "",
                  "This revalidates the old durable checkpoint with the unchanged v1",
                  "generation identity and records token-budget evidence. Hidden reasoning",
                  "text is never emitted.",
              ),
              code(
                  "required_v1 = (",
                  "    Path(os.environ['INPUT_DIR']) / 'accepted.jsonl',",
                  "    Path(os.environ['SUBSET_DIR']) / 'p0-2000.jsonl',",
                  "    Path(os.environ['V1_PILOT_DIR']) / 'checkpoint' / 'run-identity.json',",
                  ")",
                  "missing = [str(path) for path in required_v1 if not path.exists()]",
                  "if missing:",
                  "    raise FileNotFoundError(",
                  "        'Preserved v1 evidence is incomplete; missing: ' + ', '.join(missing)",
                  "    )",
                  "",
                  "run_teacher(",
                  "    'scripts/teacher_distillation/diagnose_teacher_data.py',",
                  "    '--distillation-config',",
                  "    'configs/distillation/python/qwen38_27b_v1.yaml',",
                  "    '--input',",
                  "    str(Path(os.environ['SUBSET_DIR']) / 'p0-2000.jsonl'),",
                  "    '--checkpoint-dir',",
                  "    str(Path(os.environ['V1_PILOT_DIR']) / 'checkpoint'),",
                  "    '--output-dir',",
                  "    os.environ['V1_DIAG_DIR'],",
                  ")",
              ),
              markdown(
                  "## 9. Build and seal the deterministic 200-record v2 input",
                  "",
                  "The already sealed v1 accepted input is deterministically sampled, then",
                  "the teacher-only concise-answer policy is applied and SHA-256 sealed.",
                  "Existing sealed v2 input is verified and reused.",
              ),
              code(
                  "import hashlib",
                  "",
                  "def file_sha256(path: Path) -> str:",
                  "    digest = hashlib.sha256()",
                  "    with path.open('rb') as handle:",
                  "        for chunk in iter(lambda: handle.read(1024 * 1024), b''):",
                  "            digest.update(chunk)",
                  "    return digest.hexdigest()",
                  "",
                  "v2_input = Path(os.environ['V2_INPUT'])",
                  "v2_sidecar = v2_input.with_suffix(v2_input.suffix + '.sha256')",
                  "if v2_input.exists() or v2_sidecar.exists():",
                  "    if not v2_input.is_file() or not v2_sidecar.is_file():",
                  "        raise RuntimeError(",
                  "            'v2 input payload/sidecar pair is incomplete; do not guess at recovery'",
                  "        )",
                  "    expected = v2_sidecar.read_text(encoding='ascii').split()[0]",
                  "    actual = file_sha256(v2_input)",
                  "    if actual != expected:",
                  "        raise RuntimeError('existing v2 input checksum mismatch')",
                  "    print('Reusing sealed v2 input:', v2_input)",
                  "    print('SHA-256:', actual)",
                  "else:",
                  "    run_teacher(",
                  "        'scripts/teacher_distillation/select_teacher_input.py',",
                  "        '--input',",
                  "        str(Path(os.environ['INPUT_DIR']) / 'accepted.jsonl'),",
                  "        '--output',",
                  "        os.environ['V2_SOURCE_INPUT'],",
                  "        '--count',",
                  "        '200',",
                  "    )",
                  "    run_teacher(",
                  "        'scripts/teacher_distillation/prepare_teacher_v2_input.py',",
                  "        '--input',",
                  "        os.environ['V2_SOURCE_INPUT'],",
                  "        '--output',",
                  "        os.environ['V2_INPUT'],",
                  "    )",
              ),
              markdown(
                  "## 10. Preflight the v2 generation identity without loading the teacher",
                  "",
                  "This validates the v2 config, sealed input, checkpoint namespace, and run",
                  "identity before expensive inference.",
              ),
              code(
                  "run_teacher(",
                  "    'scripts/teacher_distillation/generate_teacher_data.py',",
                  "    '--config',",
                  "    'configs/distillation/python/qwen38_27b_v2.yaml',",
                  "    '--input',",
                  "    os.environ['V2_INPUT'],",
                  "    '--checkpoint-dir',",
                  "    os.environ['V2_CHECKPOINT_DIR'],",
                  "    '--work-dir',",
                  "    '/content/tqc-distillation-v2-200',",
                  "    '--status-only',",
                  ")",
              ),
              markdown(
                  "## 11. Generate or resume the bounded 200-record v2 study",
                  "",
                  "This is the only cell here that loads Qwen3.8-27B. Re-running verifies",
                  "and skips already sealed shards in the fresh v2 checkpoint namespace.",
              ),
              code(
                  "run_teacher(",
                  "    'scripts/teacher_distillation/generate_teacher_data.py',",
                  "    '--config',",
                  "    'configs/distillation/python/qwen38_27b_v2.yaml',",
                  "    '--input',",
                  "    os.environ['V2_INPUT'],",
                  "    '--checkpoint-dir',",
                  "    os.environ['V2_CHECKPOINT_DIR'],",
                  "    '--work-dir',",
                  "    '/content/tqc-distillation-v2-200',",
                  ")",
              ),
              markdown(
                  "## 12. Verify the durable v2 checkpoint without loading the teacher",
              ),
              code(
                  "run_teacher(",
                  "    'scripts/teacher_distillation/generate_teacher_data.py',",
                  "    '--config',",
                  "    'configs/distillation/python/qwen38_27b_v2.yaml',",
                  "    '--input',",
                  "    os.environ['V2_INPUT'],",
                  "    '--checkpoint-dir',",
                  "    os.environ['V2_CHECKPOINT_DIR'],",
                  "    '--work-dir',",
                  "    '/content/tqc-distillation-v2-200',",
                  "    '--status-only',",
                  ")",
              ),
              markdown(
                  "## 13. Diagnose v2 against the actual student conversation",
                  "",
                  "The teacher-only concise policy is stripped before student token counts",
                  "are measured. Diagnostics retain reasoning character counts, never hidden",
                  "reasoning text.",
              ),
              code(
                  "run_teacher(",
                  "    'scripts/teacher_distillation/diagnose_teacher_data.py',",
                  "    '--distillation-config',",
                  "    'configs/distillation/python/qwen38_27b_v2.yaml',",
                  "    '--input',",
                  "    os.environ['V2_INPUT'],",
                  "    '--checkpoint-dir',",
                  "    os.environ['V2_CHECKPOINT_DIR'],",
                  "    '--output-dir',",
                  "    os.environ['V2_DIAG_DIR'],",
                  ")",
              ),
              markdown(
                  "## 14. Finalize v2 with fail-closed protected-benchmark checks",
                  "",
                  "Finalization checks HumanEval, MBPP, and the repository holdout after",
                  "generation and refuses to write training files unless contamination is",
                  "clean. The teacher-only v2 instruction is stripped before corpus writing.",
              ),
              code(
                  "run_teacher(",
                  "    'scripts/teacher_distillation/finalize_teacher_data.py',",
                  "    '--distillation-config',",
                  "    'configs/distillation/python/qwen38_27b_v2.yaml',",
                  "    '--data-config',",
                  "    'configs/data/python/qwen38_27b_distilled_v2.yaml',",
                  "    '--input',",
                  "    os.environ['V2_INPUT'],",
                  "    '--checkpoint-dir',",
                  "    os.environ['V2_CHECKPOINT_DIR'],",
                  "    '--output-dir',",
                  "    os.environ['V2_FINAL_DIR'],",
                  ")",
              ),
              markdown(
                  "## 15. Mechanically qualify the bounded study",
                  "",
                  "Qualification requires >=90% normal stops, >=80% student-length",
                  "acceptance among normal stops, and contamination status `clean`.",
                  "A failing command still writes qualification.json for inspection.",
              ),
              code(
                  "qualification = run_teacher(",
                  "    'scripts/teacher_distillation/qualify_teacher_study.py',",
                  "    '--diagnostics-summary',",
                  "    str(Path(os.environ['V2_DIAG_DIR']) / 'teacher-length-summary.json'),",
                  "    '--dataset-manifest',",
                  "    str(Path(os.environ['V2_FINAL_DIR']) / 'dataset-manifest.json'),",
                  "    '--output',",
                  "    os.environ['V2_QUALIFICATION'],",
                  "    check=False,",
                  ")",
                  "print('qualification exit code:', qualification.returncode)",
              ),
              markdown("## 16. Inspect the scaling decision"),
              code(
                  "import json",
                  "",
                  "qualification_path = Path(os.environ['V2_QUALIFICATION'])",
                  "if not qualification_path.is_file():",
                  "    raise FileNotFoundError('qualification.json was not written')",
                  "decision = json.loads(qualification_path.read_text(encoding='utf-8'))",
                  "print(json.dumps(decision, indent=2, sort_keys=True))",
                  "if decision.get('qualified') is not True:",
                  "    print('DO NOT SCALE. Revise the policy and rerun a bounded study.')",
                  "else:",
                  "    print('QUALIFIED. A fresh 2,000-record v2 experiment may be prepared.')",
              ),
              markdown(
                  "## 17. Scaling guard",
                  "",
                  "This notebook never automatically spends GPU time on the 2,000-record",
                  "successor. The guard raises unless the bounded study qualified.",
              ),
              code(
                  "if decision.get('qualified') is not True:",
                  "    raise RuntimeError(",
                  "        'v2-200 did not qualify; 2,000-record generation is blocked'",
                  "    )",
                  "print('v2-200 qualified; preserve this evidence before scaling.')",
              ),
          ]

          # Fail the helper before writing malformed notebook code.
          for index, cell in enumerate(cells):
              if cell.get("cell_type") == "code":
                  try:
                      ast.parse("".join(cell.get("source", [])))
                  except SyntaxError as exc:
                      raise RuntimeError(f"generated code cell {index} is invalid") from exc

          notebook = {
              "cells": cells,
              "metadata": {
                  "accelerator": "GPU",
                  "colab": {
                      "name": "qwen38_teacher_distillation_v2_colab.ipynb",
                      "provenance": [],
                  },
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3",
                  },
                  "language_info": {"name": "python"},
              },
              "nbformat": 4,
              "nbformat_minor": 5,
          }
          notebook_path = Path(
              "scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb"
          )
          notebook_path.write_text(
              json.dumps(notebook, indent=1, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"wrote {notebook_path} with {len(cells)} cells")
          PY
      - name: Format repository
        run: uv run --frozen ruff format .
      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path("scripts/teacher_distillation/qwen38_teacher_distillation_v2_colab.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook["nbformat"] == 4
          assert notebook["nbformat_minor"] == 5
          assert len(notebook["cells"]) >= 30
          joined = "\n".join(
              "".join(cell.get("source", [])) for cell in notebook["cells"]
          )
          for index, cell in enumerate(notebook["cells"]):
              if cell.get("cell_type") == "code":
                  try:
                      ast.parse("".join(cell.get("source", [])))
                  except SyntaxError as exc:
                      raise AssertionError(f"invalid code cell {index}") from exc
          for required in (
              "qwen38_27b_v2.yaml",
              "--status-only",
              "diagnose_teacher_data.py",
              "finalize_teacher_data.py",
              "qualify_teacher_study.py",
              "DO NOT SCALE",
              "2,000-record generation is blocked",
          ):
              assert required in joined, required
          assert "reasoning effort changes from `xhigh` to `high`" not in joined
          PY
      - name: Validate full CPU quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check
      - name: Commit validated notebook and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v2-notebook.yml
          git add -A
          git commit -m "feat: finalize bounded teacher v2 workflow"
          git push origin HEAD:master
