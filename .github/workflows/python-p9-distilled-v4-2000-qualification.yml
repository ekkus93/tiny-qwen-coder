name: Python P9 Distilled V4-2000 Winner Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/python-p9-distilled-v4-2000-qualification.yml"
      - "docs/evidence/P9_007_DEVELOPMENT_RUN_34255423595.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: python-p9-distilled-v4-2000-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Qualify only repaired V4-2000 step 185
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DEVELOPMENT_RUN_ID: "34255423595"
      DEVELOPMENT_RUN_ATTEMPT: "2"
      DEVELOPMENT_JOB_ID: "102160760346"
      DEVELOPMENT_SOURCE_SHA: "00ef8ad3e2edf2e8e97636026eb66bc2fb7fd8f5"
      DEVELOPMENT_ARTIFACT_ID: "10070646552"
      DEVELOPMENT_ARTIFACT_NAME: "p9-007c-development-00ef8ad3e2edf2e8e97636026eb66bc2fb7fd8f5"
      DEVELOPMENT_ARTIFACT_DIGEST: "sha256:514c6be5de40d881a42c31bf7574ae61730254a036051ddf7e8603a4206ec286"
      DEVELOPMENT_ARTIFACT_SIZE: "379655"
      TRAJECTORY_RUN_ID: "34230186622"
      TRAJECTORY_JOB_ID: "102074065676"
      TRAJECTORY_SOURCE_SHA: "d434ed274f2bcf56ca8e37863076c8937d30c83f"
      TRAJECTORY_ARTIFACT_ID: "10059380380"
      TRAJECTORY_ARTIFACT_NAME: "python-p9-distilled-v4-2000-trajectory-d434ed274f2bcf56ca8e37863076c8937d30c83f"
      TRAJECTORY_ARTIFACT_DIGEST: "sha256:9bc106fa6d334119366b108f4225f71b69c88fb05bbf772467ebb064ebc00e5b"
      TRAJECTORY_ARTIFACT_SIZE: "101757093"
      SELECTED_STEP: "185"
      SELECTED_ARTIFACT_SET_SHA256: "0462ed5e7dc08df76c1e72c58bf53d153ca9d74cc072a0724c62537307a476da"
      SELECTED_ADAPTER_MODEL_SHA256: "2ee57b8c6fd10237e6e2faf11a9ff376fe7115f58062a8ed54eb962c3be6478a"
      EVAL_OUTPUT: "artifacts/eval/python/p9-distilled-v4-2000-qualification-v1"

    steps:
      - name: Check out canonical master
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Require exact master execution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "P9-007E may run only from canonical master; got ${GITHUB_REF}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${GITHUB_SHA}" ]; then
            echo "checked-out SHA ${actual} does not match workflow SHA ${GITHUB_SHA}" >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          printf 'qualification_source_git_sha=%s\n' "${actual}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Verify CUDA runtime
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          uv run --frozen python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot access CUDA on the self-hosted runner")
          if not torch.cuda.is_bf16_supported():
              raise SystemExit("CUDA device 0 does not support BF16")
          props = torch.cuda.get_device_properties(0)
          capability = torch.cuda.get_device_capability(0)
          if capability < (8, 9):
              raise SystemExit(f"GPU capability {capability} is below the frozen 4070 Ti-class target")
          if props.total_memory < 15 * 1024**3:
              raise SystemExit(f"GPU has only {props.total_memory} bytes")
          print(f"torch={torch.__version__}")
          print(f"cuda_runtime={torch.version.cuda}")
          print(f"gpu={props.name}")
          print(f"capability={capability}")
          print(f"total_memory_bytes={props.total_memory}")
          PY

      - name: Validate winner-only P9-007E authorization
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_qualification \
            validate --repo-root .

      - name: Verify clean development replay against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str) -> object:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run_id = int(os.environ["DEVELOPMENT_RUN_ID"])
          attempt = int(os.environ["DEVELOPMENT_RUN_ATTEMPT"])
          job_id = int(os.environ["DEVELOPMENT_JOB_ID"])
          jobs = get(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs"
          )
          if not isinstance(jobs, dict):
              raise SystemExit("development replay jobs response is invalid")
          matches = [item for item in jobs.get("jobs", []) if item.get("id") == job_id]
          if len(matches) != 1 or matches[0].get("conclusion") != "success":
              raise SystemExit("clean development replay job is not uniquely successful")
          if matches[0].get("run_id") not in (None, run_id):
              raise SystemExit("clean development replay job run identity drifted")

          artifact_id = int(os.environ["DEVELOPMENT_ARTIFACT_ID"])
          artifact = get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}")
          if not isinstance(artifact, dict):
              raise SystemExit("development artifact response is invalid")
          expected = {
              "id": artifact_id,
              "name": os.environ["DEVELOPMENT_ARTIFACT_NAME"],
              "digest": os.environ["DEVELOPMENT_ARTIFACT_DIGEST"],
              "size_in_bytes": int(os.environ["DEVELOPMENT_ARTIFACT_SIZE"]),
              "expired": False,
          }
          for key, value in expected.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"development artifact {key} drifted")
          workflow_run = artifact.get("workflow_run") or {}
          if workflow_run.get("id") != run_id:
              raise SystemExit("development artifact run ID drifted")
          if workflow_run.get("head_sha") != os.environ["DEVELOPMENT_SOURCE_SHA"]:
              raise SystemExit("development artifact source SHA drifted")
          print(json.dumps({"job_id": job_id, "artifact": expected}, indent=2, sort_keys=True))
          PY

      - name: Download exact clean development replay artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.DEVELOPMENT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/p9-007d-clean
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DEVELOPMENT_RUN_ID }}

      - name: Revalidate clean replay selection payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selections < <(
            find "${RUNNER_TEMP}/p9-007d-clean" -type f \
              -name "p9-007c-development-selection.json" -print | sort
          )
          if [[ "${#selections[@]}" -ne 1 ]]; then
            printf 'Expected one clean replay selection; found %s\n' "${#selections[@]}" >&2
            exit 1
          fi
          export DEVELOPMENT_SELECTION="${selections[0]}"
          uv run --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path

          row = json.loads(Path(os.environ["DEVELOPMENT_SELECTION"]).read_text(encoding="utf-8"))
          expected = [
              (25, 32, 63, 95, False),
              (50, 30, 66, 96, False),
              (100, 31, 70, 101, False),
              (185, 34, 70, 104, True),
          ]
          observed = [
              (
                  item.get("step"),
                  item.get("humaneval_passed"),
                  item.get("mbpp_passed"),
                  item.get("combined_passed"),
                  item.get("eligible"),
              )
              for item in row.get("scores", [])
          ]
          if observed != expected:
              raise SystemExit("clean replay score grid drifted")
          selected = row.get("selected") or {}
          if (
              selected.get("step") != 185
              or selected.get("humaneval_passed") != 34
              or selected.get("mbpp_passed") != 70
              or selected.get("combined_passed") != 104
              or selected.get("eligible") is not True
          ):
              raise SystemExit("clean replay winner drifted")
          if row.get("qualification_authorized") is not True:
              raise SystemExit("clean replay does not authorize qualification")
          if row.get("repository_holdout_evaluated") is not False:
              raise SystemExit("clean replay already touched repository holdout")
          print(json.dumps(row, indent=2, sort_keys=True))
          PY

      - name: Verify frozen trajectory artifact against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json
          import os
          import urllib.request

          artifact_id = int(os.environ["TRAJECTORY_ARTIFACT_ID"])
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              artifact = json.load(response)
          expected = {
              "id": artifact_id,
              "name": os.environ["TRAJECTORY_ARTIFACT_NAME"],
              "digest": os.environ["TRAJECTORY_ARTIFACT_DIGEST"],
              "size_in_bytes": int(os.environ["TRAJECTORY_ARTIFACT_SIZE"]),
              "expired": False,
          }
          for key, value in expected.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"trajectory artifact {key} drifted")
          workflow_run = artifact.get("workflow_run") or {}
          if workflow_run.get("id") != int(os.environ["TRAJECTORY_RUN_ID"]):
              raise SystemExit("trajectory artifact run ID drifted")
          if workflow_run.get("head_sha") != os.environ["TRAJECTORY_SOURCE_SHA"]:
              raise SystemExit("trajectory artifact source SHA drifted")
          print(json.dumps(expected, indent=2, sort_keys=True))
          PY

      - name: Download exact completed trajectory artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.TRAJECTORY_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/p9-007c-training
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRAJECTORY_RUN_ID }}

      - name: Locate and verify selected step 185 artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(
            find "${RUNNER_TEMP}/p9-007c-training" \
              -type f \
              -path "*/artifacts/train/python/p9-distilled-v4-2000-r8-lr1e5/training-report.json" \
              -print | sort
          )
          if [[ "${#reports[@]}" -ne 1 ]]; then
            printf 'Expected exactly one P9-007C training report; found %s\n' "${#reports[@]}" >&2
            exit 1
          fi
          training_output="$(dirname "${reports[0]}")"
          export TRAINING_OUTPUT="${training_output}"
          printf 'TRAINING_OUTPUT=%s\n' "${training_output}" >> "${GITHUB_ENV}"
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TRAINING_OUTPUT"])
          report = json.loads((root / "training-report.json").read_text(encoding="utf-8"))
          rows = [item for item in report.get("snapshots", []) if item.get("step") == 185]
          if len(rows) != 1:
              raise SystemExit("trajectory does not contain exactly one step-185 snapshot")
          row = rows[0]
          if row.get("artifact_set_sha256") != os.environ["SELECTED_ARTIFACT_SET_SHA256"]:
              raise SystemExit("step-185 artifact-set SHA drifted")
          directory = root / row["directory"]
          weights = directory / "adapter_model.safetensors"
          digest = hashlib.sha256(weights.read_bytes()).hexdigest()
          if digest != os.environ["SELECTED_ADAPTER_MODEL_SHA256"]:
              raise SystemExit("step-185 adapter weights SHA drifted")
          print(json.dumps({"training_output": str(root), "selected_step": 185}, indent=2))
          PY

      - name: Confirm clean source before protected qualification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Generate winner-only 500-task qualification responses
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_qualification \
            generate \
            --training-output "${TRAINING_OUTPUT}" \
            --repo-root . \
            --device-index 0

      - name: Score winner-only qualification directly
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_qualification \
            score \
            --training-output "${TRAINING_OUTPUT}" \
            --repo-root .

      - name: Verify qualification evidence and one-shot boundary
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_qualification \
            verify \
            --training-output "${TRAINING_OUTPUT}" \
            --repo-root . \
            | tee "${RUNNER_TEMP}/p9-007e-qualification-verification.json"
          test -z "$(git status --porcelain)"

      - name: Upload complete P9-007E qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: p9-007e-qualification-${{ github.sha }}
          path: ${{ env.EVAL_OUTPUT }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload partial qualification evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p9-007e-qualification-partial-${{ github.sha }}
          path: ${{ env.EVAL_OUTPUT }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
