name: P8-002 one-shot acceptance

on:
  push:
    branches:
      - ralph/p8-002-general-tool-regression
    paths:
      - ".github/workflows/p8-002-acceptance.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: p8-002-one-shot-acceptance
  cancel-in-progress: false

jobs:
  generate:
    name: Generate P8-002 responses on GPU
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      P7_006_RUN_ID: "33422910444"
      P7_006_ARTIFACT_NAME: "python-p0-full-training-02df92a9c2d347b9fb013dc25714fe066c6bcafe"
      EXPECTED_ADAPTER_SHA256: "c94606250e112f72362eb883a55f7b2c8af854d445f6bb6194352c2806a8f276"
    steps:
      - name: Check out evaluation source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify CUDA runtime
        run: |
          set -euo pipefail
          nvidia-smi
          uv sync --frozen
          uv run --frozen python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("P8-002 requires CUDA")
          if not torch.cuda.is_bf16_supported():
              raise SystemExit("P8-002 requires BF16-capable CUDA")
          print(torch.cuda.get_device_name(0))
          PY
      - name: Confirm clean evaluation source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - name: Download canonical P7-006 artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.P7_006_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/p7-006-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.P7_006_RUN_ID }}
      - name: Locate canonical P7-006 output fail closed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find "${RUNNER_TEMP}/p7-006-artifact" -type f -path '*/artifacts/train/python/p0/adapter-manifest.json' -print | sort)
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            printf 'Expected exactly one P7-006 adapter manifest; found %s\n' "${#manifests[@]}" >&2
            exit 1
          fi
          training_output="$(dirname "${manifests[0]}")"
          actual_sha="$(sha256sum "${training_output}/adapter/adapter_model.safetensors" | awk '{print $1}')"
          test "${actual_sha}" = "${EXPECTED_ADAPTER_SHA256}"
          printf 'P7_006_TRAINING_OUTPUT=%s\n' "${training_output}" >> "${GITHUB_ENV}"
      - name: Generate exact frozen 12-case suite
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_p0_regression generate \
            --training-output "${P7_006_TRAINING_OUTPUT}"
      - name: Upload compact generation evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-002-python-p0-generation-${{ github.sha }}
          path: artifacts/eval/python/p0-general-tool-regression-v1/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Upload partial generation evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p8-002-python-p0-generation-partial-${{ github.sha }}
          path: artifacts/eval/python/p0-general-tool-regression-v1/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  score:
    name: Compare P8-002 with frozen P6 baseline
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P6_005_RUN_ID: "33301242379"
      P6_005_ARTIFACT_NAME: "python-base-baseline-da537443ab80b1380bee0fc3c7d9d01ca0574f35"
    steps:
      - name: Check out evaluation source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Download P8-002 generation evidence
        uses: actions/download-artifact@v4
        with:
          name: p8-002-python-p0-generation-${{ github.sha }}
          path: artifacts/eval/python/p0-general-tool-regression-v1
      - name: Download accepted P6-005 baseline
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.P6_005_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/p6-005-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.P6_005_RUN_ID }}
      - name: Locate P6 baseline fail closed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find "${RUNNER_TEMP}/p6-005-baseline" -type f -path '*/artifacts/eval/python/base-baseline-v1/baseline-manifest.json' -print | sort)
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            printf 'Expected exactly one P6 baseline manifest; found %s\n' "${#manifests[@]}" >&2
            exit 1
          fi
          printf 'P6_005_BASELINE_DIR=%s\n' "$(dirname "${manifests[0]}")" >> "${GITHUB_ENV}"
      - name: Score and compare
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_p0_regression score \
            --baseline-dir "${P6_005_BASELINE_DIR}"
      - name: Independently verify evidence
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_p0_regression verify \
            --baseline-dir "${P6_005_BASELINE_DIR}" \
            | tee "${RUNNER_TEMP}/p8-002-verified-comparison.json"
      - name: Upload canonical P8-002 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-002-python-p0-general-tool-regression-${{ github.sha }}
          path: |
            artifacts/eval/python/p0-general-tool-regression-v1/
            ${{ runner.temp }}/p8-002-verified-comparison.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Upload partial scoring evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p8-002-python-p0-scoring-partial-${{ github.sha }}
          path: artifacts/eval/python/p0-general-tool-regression-v1/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
