name: Temporary teacher-distillation formatter

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/format-teacher-distillation.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Apply canonical Ruff formatting and remove helper
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen ruff format .
          git diff --check
          git rm .github/workflows/format-teacher-distillation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format teacher distillation files"
          git push origin HEAD:master
