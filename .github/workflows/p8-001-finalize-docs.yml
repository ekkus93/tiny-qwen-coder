name: P8-001 finalize accepted evidence

on:
  push:
    branches:
      - ralph/p8-001-python-p0-evaluation
    paths:
      - ".github/workflows/p8-001-finalize-docs.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/p8-001-python-p0-evaluation
          clean: true
          fetch-depth: 1
      - name: Record accepted P8-001 evidence
        run: |
          set -euo pipefail
          python scripts/tmp_finalize_p8_001.py
          git diff --check
      - name: Commit accepted evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md docs/P8_001_PYTHON_P0_EVALUATION.md
          git diff --cached --check
          git commit -m "docs: record accepted P8-001 evaluation"
          git push origin HEAD:ralph/p8-001-python-p0-evaluation
