name: P7-007 Temporary Ruff Format

on:
  push:
    branches:
      - ralph/p7-007-adapter-inference-validation
    paths:
      - "src/tiny_qwen_coder/runtime/adapter_validation.py"
      - ".github/workflows/p7-007-temp-ruff-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ralph/p7-007-adapter-inference-validation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Format P7-007 module
        run: uv run --frozen ruff format src/tiny_qwen_coder/runtime/adapter_validation.py

      - name: Commit mechanical formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- src/tiny_qwen_coder/runtime/adapter_validation.py; then
            echo "Ruff reported no formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/runtime/adapter_validation.py
          git commit -m "style: format P7-007 validator"
          git push origin HEAD:ralph/p7-007-adapter-inference-validation
