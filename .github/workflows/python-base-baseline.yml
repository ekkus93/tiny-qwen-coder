name: Python Base Baseline GPU

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-base-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate unchanged-base responses on GPU
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 240

    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out canonical source commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Inspect NVIDIA GPU
        run: |
          set -euo pipefail
          nvidia-smi

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Verify PyTorch CUDA access
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot access CUDA on the self-hosted runner")
          print(f"torch={torch.__version__}")
          print(f"cuda_runtime={torch.version.cuda}")
          print(f"gpu={torch.cuda.get_device_name(0)}")
          print(f"capability={torch.cuda.get_device_capability(0)}")
          total = torch.cuda.get_device_properties(0).total_memory
          print(f"total_memory_bytes={total}")
          PY

      - name: Confirm clean source tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Generate canonical unchanged-base responses
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation._baseline_stages generate
          find artifacts/eval/python/base-baseline-v1 -type f -print | sort

      - name: Upload GPU generation evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-base-generation-${{ github.sha }}
          path: artifacts/eval/python/base-baseline-v1/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload partial GPU evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-base-generation-partial-${{ github.sha }}
          path: artifacts/eval/python/base-baseline-v1/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  score:
    name: Score generated responses in OCI sandbox
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      EXECUTION_IMAGE: python:3.11.14-slim@sha256:c8271b1f627d0068857dce5b53e14a9558603b527e46f1f901722f935b786a39

    steps:
      - name: Check out canonical source commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Download GPU generation evidence
        uses: actions/download-artifact@v4
        with:
          name: python-base-generation-${{ github.sha }}
          path: artifacts/eval/python/base-baseline-v1

      - name: Prepare constrained execution image
        run: |
          set -euo pipefail
          docker --version
          docker pull "${EXECUTION_IMAGE}"
          docker image inspect "${EXECUTION_IMAGE}" >/dev/null

      - name: Confirm clean source tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Score GPU responses under constrained execution
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation._baseline_stages score \
            | tee "${RUNNER_TEMP}/python-baseline-manifest.json"

      - name: Verify frozen baseline artifacts
        run: |
          set -euo pipefail
          uv run --frozen tiny-qwen-coder-python-baseline --verify-only \
            | tee "${RUNNER_TEMP}/python-baseline-verified.json"
          find artifacts/eval/python/base-baseline-v1 -type f -print | sort

      - name: Upload canonical baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-base-baseline-${{ github.sha }}
          path: |
            artifacts/eval/python/base-baseline-v1/
            ${{ runner.temp }}/python-baseline-manifest.json
            ${{ runner.temp }}/python-baseline-verified.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload partial scoring evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-base-scoring-partial-${{ github.sha }}
          path: artifacts/eval/python/base-baseline-v1/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
