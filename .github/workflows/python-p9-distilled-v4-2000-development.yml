name: Python P9 Distilled V4-2000 Development Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/python-p9-distilled-v4-2000-development.yml"
      - "docs/evidence/P9_007_DISTILLED_V4_2000_TRAJECTORY.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: python-p9-distilled-v4-2000-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development:
    name: Evaluate four repaired V4-2000 development checkpoints
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRAJECTORY_RUN_ID: "34230186622"
      TRAJECTORY_JOB_ID: "102074065676"
      TRAJECTORY_SOURCE_SHA: "d434ed274f2bcf56ca8e37863076c8937d30c83f"
      TRAJECTORY_ARTIFACT_ID: "10059380380"
      TRAJECTORY_ARTIFACT_NAME: "python-p9-distilled-v4-2000-trajectory-d434ed274f2bcf56ca8e37863076c8937d30c83f"
      TRAJECTORY_ARTIFACT_DIGEST: "sha256:9bc106fa6d334119366b108f4225f71b69c88fb05bbf772467ebb064ebc00e5b"
      TRAJECTORY_ARTIFACT_SIZE: "101757093"
      EVAL_OUTPUT: "artifacts/eval/python/p9-distilled-v4-2000-development-v1"

    steps:
      - name: Check out canonical master
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Require exact master execution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "P9-007 development may run only from canonical master; got ${GITHUB_REF}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${GITHUB_SHA}" ]; then
            echo "checked-out SHA ${actual} does not match workflow SHA ${GITHUB_SHA}" >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          printf 'evaluation_source_git_sha=%s\n' "${actual}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Verify CUDA runtime
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          uv run --frozen python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot access CUDA on the self-hosted runner")
          if not torch.cuda.is_bf16_supported():
              raise SystemExit("CUDA device 0 does not support BF16")
          props = torch.cuda.get_device_properties(0)
          capability = torch.cuda.get_device_capability(0)
          if capability < (8, 9):
              raise SystemExit(f"GPU capability {capability} is below the frozen 4070 Ti-class target")
          if props.total_memory < 15 * 1024**3:
              raise SystemExit(f"GPU has only {props.total_memory} bytes")
          print(f"torch={torch.__version__}")
          print(f"cuda_runtime={torch.version.cuda}")
          print(f"gpu={props.name}")
          print(f"capability={capability}")
          print(f"total_memory_bytes={props.total_memory}")
          PY

      - name: Validate frozen P9-007 development contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_trajectory \
            validate --repo-root .

      - name: Verify frozen trajectory evidence and GitHub artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          evidence = json.loads(
              Path("docs/evidence/P9_007_DISTILLED_V4_2000_TRAJECTORY.json").read_text(
                  encoding="utf-8"
              )
          )
          if evidence.get("task_id") != "P9-007C" or evidence.get("status") != "passed":
              raise SystemExit("P9-007C trajectory evidence is not frozen as passed")
          expected = {
              "workflow_run_id": int(os.environ["TRAJECTORY_RUN_ID"]),
              "workflow_job_id": int(os.environ["TRAJECTORY_JOB_ID"]),
              "source_git_sha": os.environ["TRAJECTORY_SOURCE_SHA"],
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"frozen trajectory evidence {key} drifted")

          training = evidence.get("training") or {}
          if training.get("global_steps") != 185 or training.get("trajectory_max_steps") != 185:
              raise SystemExit("frozen trajectory completion evidence drifted")
          if training.get("checkpoint_steps") != [25, 50, 100, 185] or training.get("snapshot_count") != 4:
              raise SystemExit("frozen trajectory checkpoint grid drifted")
          if training.get("promotable") is not False:
              raise SystemExit("trajectory must remain non-promotable before development scoring")

          development = evidence.get("development") or {}
          if development.get("authorized") is not True:
              raise SystemExit("P9-007 development evaluation is not authorized")
          if development.get("repository_holdout_evaluated") is not False:
              raise SystemExit("frozen evidence claims repository holdout use")
          if (
              development.get("humaneval_total"),
              development.get("mbpp_total"),
              development.get("combined_total"),
          ) != (45, 130, 175):
              raise SystemExit("frozen development cardinality drifted")

          artifact_expected = evidence.get("actions_artifact") or {}
          checks = {
              "artifact_id": int(os.environ["TRAJECTORY_ARTIFACT_ID"]),
              "artifact_name": os.environ["TRAJECTORY_ARTIFACT_NAME"],
              "artifact_digest": os.environ["TRAJECTORY_ARTIFACT_DIGEST"],
              "size_bytes": int(os.environ["TRAJECTORY_ARTIFACT_SIZE"]),
          }
          for key, value in checks.items():
              if artifact_expected.get(key) != value:
                  raise SystemExit(f"frozen actions artifact {key} drifted")

          artifact_id = checks["artifact_id"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              artifact = json.load(response)
          github_checks = {
              "id": checks["artifact_id"],
              "name": checks["artifact_name"],
              "digest": checks["artifact_digest"],
              "size_in_bytes": checks["size_bytes"],
          }
          for key, value in github_checks.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"GitHub trajectory artifact {key} mismatch")
          if (artifact.get("workflow_run") or {}).get("id") != int(os.environ["TRAJECTORY_RUN_ID"]):
              raise SystemExit("GitHub trajectory artifact workflow run ID mismatch")
          if (artifact.get("workflow_run") or {}).get("head_sha") not in (
              None,
              os.environ["TRAJECTORY_SOURCE_SHA"],
          ):
              raise SystemExit("GitHub trajectory artifact source SHA mismatch")
          if artifact.get("expired") is not False:
              raise SystemExit("frozen P9-007C trajectory artifact is expired")
          print(json.dumps(github_checks, indent=2, sort_keys=True))
          PY

      - name: Download exact completed trajectory artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.TRAJECTORY_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/p9-007c-training
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRAJECTORY_RUN_ID }}

      - name: Locate and verify exact trajectory output fail closed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(
            find "${RUNNER_TEMP}/p9-007c-training" \
              -type f \
              -path "*/artifacts/train/python/p9-distilled-v4-2000-r8-lr1e5/training-report.json" \
              -print | sort
          )
          if [[ "${#reports[@]}" -ne 1 ]]; then
            printf 'Expected exactly one P9-007C training report; found %s\n' "${#reports[@]}" >&2
            exit 1
          fi
          training_output="$(dirname "${reports[0]}")"
          test -f "${training_output}/run-manifest.json"
          for step in 0025 0050 0100 0185; do
            test -f "${training_output}/snapshots/step-${step}/adapter_config.json"
            test -f "${training_output}/snapshots/step-${step}/adapter_model.safetensors"
          done
          export TRAINING_OUTPUT="${training_output}"
          printf 'TRAINING_OUTPUT=%s\n' "${training_output}" >> "${GITHUB_ENV}"

          uv run --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("docs/evidence/P9_007_DISTILLED_V4_2000_TRAJECTORY.json").read_text(
                  encoding="utf-8"
              )
          )
          root = Path(os.environ["TRAINING_OUTPUT"])
          report = json.loads((root / "training-report.json").read_text(encoding="utf-8"))
          if report.get("run_id") != evidence["training"]["run_id"]:
              raise SystemExit("downloaded trajectory run ID drifted")
          if report.get("global_steps") != 185 or report.get("checkpoint_steps") != [25, 50, 100, 185]:
              raise SystemExit("downloaded trajectory completion drifted")
          rows = report.get("snapshots")
          if not isinstance(rows, list) or len(rows) != 4:
              raise SystemExit("downloaded trajectory snapshot inventory drifted")
          expected = {row["step"]: row for row in evidence["snapshots"]}
          for row in rows:
              step = row.get("step")
              frozen = expected.get(step)
              if frozen is None:
                  raise SystemExit(f"unexpected snapshot step {step}")
              if row.get("artifact_set_sha256") != frozen["artifact_set_sha256"]:
                  raise SystemExit(f"snapshot {step} artifact-set SHA drifted")
              files = {item["path"]: item for item in row.get("files", [])}
              config = files.get("adapter_config.json")
              model = files.get("adapter_model.safetensors")
              if config is None or model is None:
                  raise SystemExit(f"snapshot {step} lacks canonical adapter files")
              if (
                  config.get("sha256") != frozen["adapter_config_sha256"]
                  or config.get("size_bytes") != frozen["adapter_config_size_bytes"]
                  or model.get("sha256") != frozen["adapter_model_sha256"]
                  or model.get("size_bytes") != frozen["adapter_model_size_bytes"]
              ):
                  raise SystemExit(f"snapshot {step} frozen identity drifted")
          print(json.dumps({"training_output": str(root), "steps": sorted(expected)}, indent=2))
          PY

      - name: Confirm clean evaluation source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Generate all four frozen development checkpoints
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_trajectory \
            generate-trajectory \
            --training-output "${TRAINING_OUTPUT}" \
            --repo-root . \
            --device-index 0

      - name: Score all four transported checkpoints directly
        shell: bash
        run: |
          set -euo pipefail
          for step in 25 50 100 185; do
            uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_trajectory \
              score \
              --training-output "${TRAINING_OUTPUT}" \
              --step "${step}" \
              --repo-root .
          done

      - name: Apply frozen mechanical development selection
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m tiny_qwen_coder.evaluation.python_distilled_trajectory \
            select \
            --scores-root "${EVAL_OUTPUT}" \
            --repo-root . \
            | tee "${RUNNER_TEMP}/p9-007c-development-selection.json"

      - name: Verify complete development evidence and zero qualification use
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVAL_OUTPUT"])
          expected_steps = [25, 50, 100, 185]
          scores = []
          for step in expected_steps:
              directory = root / f"step-{step:04d}"
              stage = json.loads((directory / "generation-stage.json").read_text(encoding="utf-8"))
              score = json.loads((directory / "development-score.json").read_text(encoding="utf-8"))
              if stage.get("repository_holdout_requests") != 0:
                  raise SystemExit("development generation touched repository holdout")
              if (stage.get("humaneval_requests"), stage.get("mbpp_requests")) != (45, 130):
                  raise SystemExit("development generation cardinality drifted")
              if score.get("repository_holdout_evaluated") is not False:
                  raise SystemExit("development scoring touched repository holdout")
              if (
                  score.get("humaneval_total"),
                  score.get("mbpp_total"),
                  score.get("combined_total"),
              ) != (45, 130, 175):
                  raise SystemExit("development score cardinality drifted")
              if score.get("step") != step:
                  raise SystemExit("development score step identity drifted")
              scores.append(score)

          selection_path = root / "p9-007c-development-selection.json"
          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          if selection.get("repository_holdout_evaluated") is not False:
              raise SystemExit("selection claims qualification holdout evaluation")
          if [row.get("step") for row in selection.get("scores", [])] != expected_steps:
              raise SystemExit("selection score grid drifted")
          selected = selection.get("selected")
          authorized = selection.get("qualification_authorized")
          if (selected is None) == bool(authorized):
              raise SystemExit("qualification authorization does not match selected candidate")
          if selected is not None and selected.get("eligible") is not True:
              raise SystemExit("selected development candidate is not eligible")

          summary = {
              "scores": [
                  {
                      "step": row["step"],
                      "humaneval": row["humaneval_passed"],
                      "mbpp": row["mbpp_passed"],
                      "combined": row["combined_passed"],
                      "eligible": row["eligible"],
                  }
                  for row in scores
              ],
              "selected": selected,
              "qualification_authorized": authorized,
              "repository_holdout_evaluated": False,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## P9-007C development selection\n\n")
              handle.write("| step | HumanEval | MBPP | combined | eligible |\n")
              handle.write("| ---: | ---: | ---: | ---: | :---: |\n")
              for row in scores:
                  handle.write(
                      f"| {row['step']} | {row['humaneval_passed']}/45 | "
                      f"{row['mbpp_passed']}/130 | {row['combined_passed']}/175 | "
                      f"{str(row['eligible']).lower()} |\n"
                  )
              handle.write(
                  f"\nQualification authorized: **{str(bool(authorized)).lower()}**\n"
              )
              handle.write("\nRepository holdout evaluated: **false**\n")
          PY
          test "$(find "${EVAL_OUTPUT}" -name development-score.json -type f | wc -l)" -eq 4

      - name: Upload complete P9-007 development evidence
        uses: actions/upload-artifact@v4
        with:
          name: p9-007c-development-${{ github.sha }}
          path: ${{ env.EVAL_OUTPUT }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload partial P9-007 development evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p9-007c-development-partial-${{ github.sha }}
          path: ${{ env.EVAL_OUTPUT }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
