name: Fix Colab CUDA 13 verification text

on:
  push:
    paths:
      - .github/workflows/fix-colab-cu130-doc.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Fix stale CUDA verification text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          old = "torch CUDA: 12.9"
          new = "torch CUDA: 13.0"
          changed = 0
          for cell in notebook["cells"]:
              source = cell.get("source", [])
              for index, line in enumerate(source):
                  updated = line.replace(old, new)
                  if updated != line:
                      source[index] = updated
                      changed += 1
          if changed != 1:
              raise RuntimeError(f"expected one stale CUDA text occurrence; found {changed}")
          path.write_text(
              json.dumps(notebook, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate full CPU quality gates
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen ruff format scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check

      - name: Commit validated fix and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/fix-colab-cu130-doc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/teacher_distillation/qwen38_teacher_distillation_colab.ipynb .github/workflows/fix-colab-cu130-doc.yml
          git commit -m "docs: correct Colab CUDA 13 verification text"
          git push origin HEAD:master
