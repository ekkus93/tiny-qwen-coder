name: P9-009 Lint Fix Once

on:
  push:
    branches:
      - p9/executable-semantic-filtering
    paths:
      - .github/workflows/p9-009-lint-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Fix P9-009 lint issue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tiny_qwen_coder/distillation/semantic_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = '''        elif isinstance(node, ast.Call):
            if isinstance(node.func, ast.Name) and node.func.id in _FORBIDDEN_CALL_NAMES:
                return f"forbidden_call:{node.func.id}"
'''
          new = '''        elif (
            isinstance(node, ast.Call)
            and isinstance(node.func, ast.Name)
            and node.func.id in _FORBIDDEN_CALL_NAMES
        ):
            return f"forbidden_call:{node.func.id}"
'''
          if old not in text:
              raise SystemExit('expected SIM102 block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uv run --frozen ruff format src/tiny_qwen_coder/distillation/semantic_contracts.py
          uv run --frozen ruff check src/tiny_qwen_coder/distillation/semantic_contracts.py
      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tiny_qwen_coder/distillation/semantic_contracts.py
          git commit -m 'fix: satisfy P9-009 lint gate'
          git push origin HEAD:p9/executable-semantic-filtering
