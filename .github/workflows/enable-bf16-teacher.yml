name: Temporary BF16 teacher runtime update

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/enable-bf16-teacher.yml"

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Enable native BF16 teacher weights
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config_path = Path("src/tiny_qwen_coder/distillation/config.py")
          text = config_path.read_text(encoding="utf-8")
          old = 'TeacherQuantization = Literal["bitsandbytes"]'
          new = 'TeacherQuantization = Literal["bitsandbytes", "none"]'
          if old not in text:
              raise RuntimeError("TeacherQuantization declaration changed unexpectedly")
          text = text.replace(old, new, 1)
          old = '    if quantization != "bitsandbytes":\n        raise TeacherDistillationConfigError("teacher.quantization must be \'bitsandbytes\'")'
          new = '    if quantization not in {"bitsandbytes", "none"}:\n        raise TeacherDistillationConfigError(\n            "teacher.quantization must be one of: bitsandbytes, none"\n        )'
          if old not in text:
              raise RuntimeError("teacher quantization parser changed unexpectedly")
          config_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          backend_path = Path("src/tiny_qwen_coder/distillation/vllm_backend.py")
          text = backend_path.read_text(encoding="utf-8")
          text = text.replace(
              '"""Batch Qwen3.8 inference using vLLM and in-flight 4-bit quantization."""',
              '"""Batch Qwen3.8 inference using vLLM with BF16 or optional 4-bit weights."""',
              1,
          )
          old = '        required = {\n            "vllm": config.runtime.vllm_version,\n            "vllm-bnb-plugin": config.runtime.vllm_bnb_plugin_version,\n            "bitsandbytes": config.runtime.bitsandbytes_version,\n        }'
          new = '        required = {"vllm": config.runtime.vllm_version}\n        if config.teacher.quantization == "bitsandbytes":\n            required.update(\n                {\n                    "vllm-bnb-plugin": config.runtime.vllm_bnb_plugin_version,\n                    "bitsandbytes": config.runtime.bitsandbytes_version,\n                }\n            )'
          if old not in text:
              raise RuntimeError("vLLM runtime verification block changed unexpectedly")
          text = text.replace(old, new, 1)
          old = '                "vLLM is unavailable; Colab setup must install vllm, vllm-bnb-plugin, "\n                "and bitsandbytes before generation"'
          new = '                "vLLM is unavailable; Colab setup must install the pinned teacher runtime "\n                "before generation"'
          if old not in text:
              raise RuntimeError("vLLM import error message changed unexpectedly")
          text = text.replace(old, new, 1)
          old = '                quantization=config.teacher.quantization,'
          new = '                quantization=(\n                    None if config.teacher.quantization == "none" else config.teacher.quantization\n                ),'
          if old not in text:
              raise RuntimeError("vLLM quantization argument changed unexpectedly")
          backend_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          yaml_path = Path("configs/distillation/python/qwen38_27b_v1.yaml")
          text = yaml_path.read_text(encoding="utf-8")
          if "  quantization: bitsandbytes\n" not in text:
              raise RuntimeError("canonical teacher quantization config changed unexpectedly")
          text = text.replace("  quantization: bitsandbytes\n", "  quantization: none\n", 1)
          text = text.replace("id: python-qwen38-27b-v1\n", "id: python-qwen38-27b-bf16-v1\n", 1)
          yaml_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_teacher_distillation.py")
          text = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_teacher_finalization_prefilter_rejects_truncation_and_bad_python() -> None:\n"
          if marker not in text:
              raise RuntimeError("teacher test insertion marker changed unexpectedly")
          test_lines = [
              "",
              "def test_unquantized_bfloat16_runtime_only_requires_vllm(",
              "    monkeypatch: pytest.MonkeyPatch,",
              ") -> None:",
              "    import tiny_qwen_coder.distillation.vllm_backend as backend_module",
              "",
              "    config = replace(",
              "        _config(),",
              "        teacher=replace(_config().teacher, quantization=\"none\"),",
              "    )",
              "    installed = {\"vllm\": \"0.28.0\"}",
              "    monkeypatch.setattr(",
              "        importlib_metadata,",
              "        \"version\",",
              "        lambda distribution: installed[distribution],",
              "    )",
              "",
              "    backend_module.VllmTeacherBackend._verify_runtime(config)",
              "    assert parse_teacher_distillation_config(asdict(config)) == config",
              "",
          ]
          text = text.replace(marker, "\n".join(test_lines) + marker, 1)
          test_path.write_text(text, encoding="utf-8")

          readme_path = Path("scripts/teacher_distillation/README.md")
          text = readme_path.read_text(encoding="utf-8")
          old = "- Runtime: vLLM 0.28.0, text-only mode\n- BitsAndBytes plugin: vllm-bnb-plugin 0.0.3\n- BitsAndBytes: 0.50.2\n- Weight loading: in-flight 4-bit BitsAndBytes quantization\n"
          new = "- Runtime: vLLM 0.28.0, text-only mode\n- Weight loading: native BF16 on the 80 GB A100\n- Weight quantization: disabled (`quantization: none`)\n"
          if old not in text:
              raise RuntimeError("README frozen runtime contract changed unexpectedly")
          text = text.replace(old, new, 1)
          text = text.replace(
              "This notebook generates replacement Python training data for the existing\nQwen3.5-4B student.",
              "This workflow generates replacement Python training data for the existing\nQwen3.5-4B student.",
          )
          readme_path.write_text(text, encoding="utf-8")
          PY

      - name: Run full CPU quality gates
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen ruff format .
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest
          git diff --check

      - name: Commit validated BF16 update and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/enable-bf16-teacher.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: use native BF16 Qwen3.8 teacher weights"
          git push origin HEAD:master
