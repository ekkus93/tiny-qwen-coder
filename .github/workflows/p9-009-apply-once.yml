name: P9-009 Apply Once

on:
  push:
    branches:
      - p9/executable-semantic-filtering
    paths:
      - .github/workflows/p9-009-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply frozen P9-009 patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/p9-009.patch
          git apply --index /tmp/p9-009.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: freeze P9-009 semantic filtering protocol'
          git push origin HEAD:p9/executable-semantic-filtering
