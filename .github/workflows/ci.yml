name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CPU quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/p6-005-baseline-harness-integrity
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Apply P6-005 harness and integrity fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          execution = Path("src/tiny_qwen_coder/evaluation/execution.py")
          text = execution.read_text(encoding="utf-8")
          old = '''_COPY_AND_EXEC_SCRIPT = (
              'set -eu; cp -R /input/. /workspace/; chmod -R u+rwX /workspace; cd /workspace; exec "$@"'
          )
          '''
          new = '''_COPY_AND_EXEC_SCRIPT = (
              'set -eu; cp -R /input/. /workspace/; '
              'for path in /workspace/* /workspace/.[!.]* /workspace/..?*; do '
              '[ -e "$path" ] || continue; chmod -R u+rwX "$path"; done; '
              'cd /workspace; exec "$@"'
          )
          '''
          if old not in text:
              raise SystemExit("expected constrained-execution bootstrap was not found")
          execution.write_text(text.replace(old, new, 1), encoding="utf-8")

          artifacts = Path("src/tiny_qwen_coder/evaluation/_baseline_artifacts.py")
          text = artifacts.read_text(encoding="utf-8")
          required_anchor = '''_REQUIRED_ARTIFACTS: tuple[tuple[str, str], ...] = (
          '''
          if required_anchor not in text:
              raise SystemExit("required artifact inventory anchor missing")
          end_anchor = ''')


def _atomic_write'''
          constants = '''
_CODING_AGGREGATES: tuple[tuple[str, str], ...] = (
    ("HumanEval", "humaneval/humaneval-aggregate.json"),
    ("MBPP", "mbpp/mbpp-aggregate.json"),
    (
        "repository holdout",
        "repository-holdout/repository-holdout-aggregate.json",
    ),
)
'''
          inventory_end = text.find(end_anchor, text.find(required_anchor))
          if inventory_end < 0:
              raise SystemExit("required artifact inventory terminator missing")
          inventory_end += len(')')
          text = text[:inventory_end] + constants + text[inventory_end:]

          helper_anchor = '''def freeze_python_baseline(
          '''
          helper = '''def _require_valid_coding_aggregates(output_dir: Path) -> None:
    """Reject incomplete coding metrics even when artifact files themselves are present."""

    for benchmark_name, relative_path in _CODING_AGGREGATES:
        context = f"{benchmark_name} aggregate"
        mapping = _read_json_mapping(output_dir / relative_path, context=context)
        harness_errors = _expect_int(mapping, "harness_errors", context=context)
        if harness_errors != 0:
            raise PythonBaselineError(
                f"{context} records {harness_errors} harness errors; baseline is invalid"
            )
        pass_at_1 = mapping.get("pass_at_1")
        if isinstance(pass_at_1, bool) or not isinstance(pass_at_1, (int, float)):
            raise PythonBaselineError(f"{context}.pass_at_1 must be a numeric value")
        if not 0.0 <= float(pass_at_1) <= 1.0:
            raise PythonBaselineError(f"{context}.pass_at_1 must be between zero and one")


'''
          if helper_anchor not in text:
              raise SystemExit("freeze helper anchor missing")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          ordered_anchor = '''    ordered = tuple(artifacts)
    manifest = PythonBaselineManifest(
          '''
          ordered_replacement = '''    ordered = tuple(artifacts)
    _require_valid_coding_aggregates(output_dir)
    manifest = PythonBaselineManifest(
          '''
          if ordered_anchor not in text:
              raise SystemExit("freeze aggregate-validation anchor missing")
          text = text.replace(ordered_anchor, ordered_replacement, 1)

          validate_anchor = '''    if actual_ids != required_ids:
        raise PythonBaselineError(
            "frozen Python baseline artifact inventory does not match the required P6-005 set"
        )
    return resolved
          '''
          validate_replacement = '''    if actual_ids != required_ids:
        raise PythonBaselineError(
            "frozen Python baseline artifact inventory does not match the required P6-005 set"
        )
    _require_valid_coding_aggregates(output_dir)
    return resolved
          '''
          if validate_anchor not in text:
              raise SystemExit("verify aggregate-validation anchor missing")
          artifacts.write_text(text.replace(validate_anchor, validate_replacement, 1), encoding="utf-8")
          PY

          uv run --frozen ruff format \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/_baseline_artifacts.py
          uv run --frozen ruff check --fix \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/_baseline_artifacts.py
          git diff --check
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tiny_qwen_coder/evaluation/execution.py \
            src/tiny_qwen_coder/evaluation/_baseline_artifacts.py
          git commit -m "fix: reject invalid baseline harness results"
          git push origin "HEAD:fix/p6-005-baseline-harness-integrity"

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src scripts tests

      - name: Test
        run: uv run --frozen pytest

      - name: Check Git whitespace
        run: git diff --check
