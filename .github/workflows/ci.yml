name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CPU quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/p6-005-baseline-harness-integrity
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Update baseline integrity test fixture
        run: |
          set -euo pipefail
          python scripts/_p6_005_test_patch.py
          uv run --frozen ruff format tests/unit/test_python_base_baseline.py tests/unit/test_p6_005_harness_integrity.py
          uv run --frozen ruff check --fix tests/unit/test_python_base_baseline.py tests/unit/test_p6_005_harness_integrity.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_p6_005_test_patch.py
          git add tests/unit/test_python_base_baseline.py tests/unit/test_p6_005_harness_integrity.py
          git commit -m "test: enforce P6-005 aggregate integrity"
          git push origin "HEAD:fix/p6-005-baseline-harness-integrity"

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src scripts tests

      - name: Test
        run: uv run --frozen pytest

      - name: Check Git whitespace
        run: git diff --check
