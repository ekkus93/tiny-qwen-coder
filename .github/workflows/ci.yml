name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CPU quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/p6-005-split-gpu-scoring
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Apply exact type fix and pinned Ruff
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tiny_qwen_coder/evaluation/_baseline_stages.py")
          text = path.read_text(encoding="utf-8")
          old = "        cuda_runtime=cast(str | None, cuda_runtime),\n"
          new = "        cuda_runtime=cuda_runtime,\n"
          if old not in text:
              raise SystemExit("expected redundant cast was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run --frozen ruff format src/tiny_qwen_coder/evaluation/_baseline_stages.py
          uv run --frozen ruff check --fix src/tiny_qwen_coder/evaluation/_baseline_stages.py
          git diff --check
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tiny_qwen_coder/evaluation/_baseline_stages.py
          git commit -m "fix: satisfy mypy for baseline stage parser"
          git push origin "HEAD:fix/p6-005-split-gpu-scoring"

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src scripts tests

      - name: Test
        run: uv run --frozen pytest

      - name: Check Git whitespace
        run: git diff --check
