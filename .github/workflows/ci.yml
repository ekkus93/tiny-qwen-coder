name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CPU quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: false

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Apply pinned Ruff autofixes
        run: |
          set -euo pipefail
          uv run --frozen ruff check --fix \
            src/tiny_qwen_coder/evaluation/_baseline_generation.py \
            src/tiny_qwen_coder/evaluation/_baseline_runner.py
          git diff --check
          if git diff --quiet; then
            echo "No Ruff autofixes remain."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tiny_qwen_coder/evaluation/_baseline_generation.py \
            src/tiny_qwen_coder/evaluation/_baseline_runner.py
          git commit -m "fix: apply Ruff baseline autofixes"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src scripts tests

      - name: Test
        run: uv run --frozen pytest

      - name: Check Git whitespace
        run: git diff --check
