name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CPU quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Diagnose Ruff autofixes
        run: |
          set -euo pipefail
          uv run --frozen ruff check --fix .
          git diff -- src/tiny_qwen_coder/evaluation/_baseline_generation.py src/tiny_qwen_coder/evaluation/_baseline_runner.py
          git diff --exit-code

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src scripts tests

      - name: Test
        run: uv run --frozen pytest

      - name: Check Git whitespace
        run: git diff --check
